    function renderNoteTagsEdit() {
      if (!state.selectedNote) return;
      const tags = noteTagObjects(state.selectedNote);
      els.noteTagsEdit.innerHTML = tags.map((t) => tagChipHtml(t, true)).join("") +
        `<button class="add-tag-btn" id="addNoteTagBtn"><i data-lucide="tag"></i><span>${tags.length ? "Add tag" : "Add tags"}</span></button>`;
      iconRefresh();
    }

    function renderFolderSelect() {
      els.moveFolderSelect.innerHTML = sortFolders(state.folders).map((f) => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join("");
      if (state.selectedNote) els.moveFolderSelect.value = state.selectedNote.folderId;
    }

    function renderFilterState() {
      const count = state.filterTagIds.size + state.filterTypes.size;
      els.filterBtn.classList.toggle("active", count > 0);
      els.filterBtn.innerHTML = `<i data-lucide="sliders-horizontal"></i>${count ? `<span class="dot-badge"></span>` : ""}`;
      const parts = [];
      if (state.filterTagIds.size) parts.push(`${state.filterTagIds.size} tag${state.filterTagIds.size > 1 ? "s" : ""}`);
      if (state.filterTypes.size) parts.push(`${state.filterTypes.size} type${state.filterTypes.size > 1 ? "s" : ""}`);
      els.filterBanner.classList.toggle("show", count > 0);
      els.filterBannerText.textContent = parts.length ? `Filtering by ${parts.join(" + ")}` : "Filtered";
      iconRefresh();
    }

    function renderEditor() {
      state.chartInstances.forEach((c) => c.destroy()); state.chartInstances.clear(); state.tableInstances.clear();
      if (!state.selectedNote) {
        els.emptyState.classList.remove("hidden");
        els.noteSurface.classList.add("hidden");
        els.saveState.textContent = "";
        els.pinBtn.classList.remove("active");
        return;
      }
      els.emptyState.classList.add("hidden");
      els.noteSurface.classList.remove("hidden");
      els.titleInput.value = state.selectedNote.title || "";
      setSaveState();
      els.pinBtn.classList.toggle("active", !!state.selectedNote.pinnedAt);
      els.pinBtn.title = state.selectedNote.pinnedAt ? "Unpin note" : "Pin note";
      renderNoteTagsEdit();
      const blocks = state.selectedNote.blocks || [];
      els.blocks.innerHTML = blocks.map((b) => renderBlock(b)).join("");
      bindBlockEnhancements();
      iconRefresh();
    }

    function renderBlock(block) {
      const menu = `<div class="block-add-gutter"><button class="block-gutter-btn" data-block-add="${block.id}" title="Add a block below" aria-label="Add block below"><i data-lucide="plus"></i></button></div><div class="block-menu"><button class="block-action danger" data-block-delete="${block.id}" aria-label="Delete block" title="Delete block"><i data-lucide="x"></i></button></div>`;
      if (block.type === "heading")
        return `<article class="block heading-block" data-block-id="${block.id}"><div class="editable" contenteditable="true" data-field="text" data-placeholder="Heading">${block.data.text || ""}</div>${menu}</article>`;
      if (block.type === "checklist")
        return `<article class="block checklist-block" data-block-id="${block.id}"><div class="check-block${block.data.checked ? " done" : ""}"><input type="checkbox" data-field="checked" ${block.data.checked ? "checked" : ""}><div class="editable" contenteditable="true" data-field="text" data-placeholder="To-do">${block.data.text || ""}</div></div>${menu}</article>`;
      if (block.type === "image") return renderImageBlock(block, menu);
      if (block.type === "file")
        return `<article class="block" data-block-id="${block.id}">${fileCardHtml(block)}${menu}</article>`;
      if (block.type === "audio" || block.type === "session" || block.type === "video") {
        const isVideo = block.type === "video";
        const label = isVideo ? "Video" : block.type === "session" ? "Full session" : "Voice clip";
        const icon = isVideo ? "video" : block.type === "session" ? "radio" : "audio-lines";
        const player = isVideo
          ? `<video class="media-video" controls playsinline data-attachment-video="${block.data.attachmentId || ""}"></video>`
          : `<audio controls data-attachment-audio="${block.data.attachmentId || ""}"></audio>`;
        const hasImages = imageItems(block).length > 0;
        return `<article class="block" data-block-id="${block.id}"><div class="audio-shell"><div class="audio-head"><div class="audio-title"><i data-lucide="${icon}"></i><span>${label}</span></div><span class="count">${formatTime(block.data.createdAt || state.selectedNote.updatedAt)}</span></div>${player}${hasImages ? imageGridHtml(block, "Add photo") : ""}${captionRowHtml(block, "Add note about this recording")}</div>${menu}</article>`;
      }
      if (block.type === "table")
        return `<article class="block" data-block-id="${block.id}"><div class="table-shell"><div class="block-head"><div class="block-title"><i data-lucide="table"></i><span>${escapeHtml(block.data.title || "Table")}</span></div></div><div class="table-controls"><button class="mini-pill" data-table-row="${block.id}"><i data-lucide="plus"></i><span>Row</span></button><button class="mini-pill" data-table-column="${block.id}"><i data-lucide="columns-3"></i><span>Column</span></button><button class="mini-pill" data-chart-from-table="${block.id}"><i data-lucide="chart-column"></i><span>Chart it</span></button></div><div class="table-mount" id="table-${block.id}"></div></div>${menu}</article>`;
      if (block.type === "chart")
        return `<article class="block" data-block-id="${block.id}"><div class="chart-shell"><div class="block-head"><div class="block-title"><i data-lucide="chart-column"></i><span>Chart</span></div><select class="select" data-chart-type="${block.id}"><option value="bar" ${block.data.chartType === "bar" ? "selected" : ""}>Bar</option><option value="line" ${block.data.chartType === "line" ? "selected" : ""}>Line</option><option value="doughnut" ${block.data.chartType === "doughnut" ? "selected" : ""}>Doughnut</option></select></div><div class="chart-config"><textarea data-chart-labels="${block.id}" placeholder="Labels, comma separated">${(block.data.labels || []).join(", ")}</textarea><textarea data-chart-values="${block.id}" placeholder="Values, comma separated">${(block.data.values || []).join(", ")}</textarea></div><div class="chart-canvas-wrap"><canvas id="chart-${block.id}"></canvas></div></div>${menu}</article>`;
      return `<article class="block text-block" data-block-id="${block.id}"><div class="editable" contenteditable="true" data-field="text" data-placeholder="Write something…">${block.data.text || ""}</div>${menu}</article>`;
    }

    // Work around MediaRecorder blobs that ship without duration metadata (duration === Infinity),
    // which otherwise leaves the play button dead and the seek bar stuck.
    function fixMediaDuration(media) {
      media.addEventListener("loadedmetadata", () => {
        if (media.duration === Infinity || isNaN(media.duration)) {
          const onUpdate = () => { media.removeEventListener("timeupdate", onUpdate); try { media.currentTime = 0; } catch {} };
          media.addEventListener("timeupdate", onUpdate);
          try { media.currentTime = 1e101; } catch {}
        }
      }, { once: true });
    }
    async function bindBlockEnhancements() {
      for (const img of $$("[data-attachment-image]")) {
        img.onerror = () => { img.replaceWith(Object.assign(document.createElement("div"), { className: "image-empty", textContent: img.dataset.fallbackText || "Photo could not be loaded." })); };
        if (img.getAttribute("src")) continue;
        const blob = await getAttachmentBlob(img.dataset.attachmentImage);
        if (blob) img.src = URL.createObjectURL(blob);
      }
      for (const audio of $$("[data-attachment-audio]")) {
        if (!audio.dataset.attachmentAudio) continue;
        const blob = await getAttachmentBlob(audio.dataset.attachmentAudio);
        if (blob) { fixMediaDuration(audio); audio.src = URL.createObjectURL(blob); }
      }
      for (const video of $$("[data-attachment-video]")) {
        if (!video.dataset.attachmentVideo) continue;
        const blob = await getAttachmentBlob(video.dataset.attachmentVideo);
        if (blob) { fixMediaDuration(video); video.src = URL.createObjectURL(blob); }
      }
      (state.selectedNote.blocks || []).filter((b) => b.type === "table").forEach(setupTableBlock);
      (state.selectedNote.blocks || []).filter((b) => b.type === "chart").forEach(setupChartBlock);
    }

    function cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

    function setupTableBlock(block) {
      const mount = $(`#table-${CSS.escape(block.id)}`);
      if (!mount || !window.Tabulator) return;
      const columns = (block.data.columns || ["Name", "Value"]).map((column) => ({ title: column, field: column, editor: "input", formatter: column === "Progress" ? progressFormatter : undefined, resizable: true }));
      const table = new Tabulator(mount, {
        data: block.data.rows || [], columns, layout: "fitColumns", height: 230, movableColumns: true, reactiveData: false,
        cellEdited: () => { block.data.rows = table.getData(); queueSave(); },
        columnMoved: () => { block.data.columns = table.getColumnDefinitions().map((c) => c.field); block.data.rows = table.getData(); queueSave(); }
      });
      state.tableInstances.set(block.id, table);
    }
    function progressFormatter(cell) {
      const value = String(cell.getValue() || "0%");
      const percent = Math.max(0, Math.min(100, Number(value.replace("%", "")) || 0));
      return `<span class="progress-cell"><span class="progress-track"><span class="progress-fill" style="width:${percent}%"></span></span><span>${escapeHtml(value)}</span></span>`;
    }

    function chartPalette() {
      const accent = cssVar("--accent") || "#3b82f6";
      return ["#3b82f6", "#16a34a", "#e08600", "#e5484d", "#7c5cff", "#0d9488", "#c03a78"].map((c, i) => i === 0 ? accent : c);
    }
    function setupChartBlock(block) {
      const canvas = $(`#chart-${CSS.escape(block.id)}`);
      if (!canvas || !window.Chart) return;
      const accent = cssVar("--accent") || "#3b82f6";
      const grid = cssVar("--border") || "rgba(0,0,0,.1)";
      const tickColor = cssVar("--muted") || "#888";
      const isDoughnut = (block.data.chartType || "bar") === "doughnut";
      const chart = new Chart(canvas, {
        type: block.data.chartType || "bar",
        data: {
          labels: block.data.labels || ["A", "B", "C"],
          datasets: [{
            label: block.data.title || "Values",
            data: (block.data.values || [12, 19, 7]).map(Number),
            borderColor: accent,
            backgroundColor: isDoughnut ? chartPalette() : (block.data.chartType === "line" ? "transparent" : accent),
            pointBackgroundColor: accent, pointBorderColor: cssVar("--surface"), pointBorderWidth: 2,
            borderRadius: 6, fill: false, tension: 0.35
          }]
        },
        options: {
          responsive: true, maintainAspectRatio: false,
          scales: isDoughnut ? {} : {
            x: { grid: { display: false }, ticks: { color: tickColor, font: { size: 11 } } },
            y: { grid: { color: grid }, ticks: { color: tickColor, font: { size: 11 } } }
          },
          plugins: { legend: { display: isDoughnut, position: "right", labels: { color: tickColor, font: { size: 11 } } } }
        }
      });
      state.chartInstances.set(block.id, chart);
    }
    function refreshChartBlock(block) {
      const chart = state.chartInstances.get(block.id);
      if (!chart) return;
      const isDoughnut = (block.data.chartType || "bar") === "doughnut";
      if (chart.config.type !== (block.data.chartType || "bar")) { chart.destroy(); state.chartInstances.delete(block.id); setupChartBlock(block); return; }
      chart.data.labels = block.data.labels || [];
      chart.data.datasets[0].data = (block.data.values || []).map(Number);
      chart.update();
    }

    function blockById(blockId) { return state.selectedNote?.blocks?.find((b) => b.id === blockId); }

    function imageItems(block) {
      if (!block?.data) return [];
      if (Array.isArray(block.data.images)) return block.data.images;
      // legacy single-image fallback only applies to image blocks (media blocks use attachmentId for the recording)
      if (block.type === "image" && (block.data.src || block.data.attachmentId || block.data.fileName))
        return [{ src: block.data.src || "", attachmentId: block.data.attachmentId || "", fileName: block.data.fileName || block.data.previewName || "", previewName: block.data.previewName || block.data.fileName || "", previewMimeType: block.data.previewMimeType || "", previewError: block.data.previewError || "" }];
      return [];
    }
    function setImageItems(block, images) {
      block.data.images = images;
      if (block.type === "image") { block.data.src = ""; block.data.fileName = ""; block.data.previewName = ""; block.data.previewMimeType = ""; block.data.previewError = ""; }
    }

    function imageGridHtml(block) {
      const images = imageItems(block);
      return `<div class="image-grid">${images.map((image, index) => `<figure class="image-tile"><img class="image-preview" ${image.src ? `src="${image.src}"` : ""} data-fallback-text="${escapeHtml(image.previewError || "Photo could not be loaded.")}" data-attachment-image="${image.attachmentId || ""}" data-view-image="${block.id}:${index}" alt="${escapeHtml(stripTags(block.data.caption || image.fileName || "Note image"))}"><button class="image-remove" data-delete-image="${block.id}:${index}" aria-label="Delete photo"><i data-lucide="x"></i></button></figure>`).join("")}<button class="image-add-tile" data-pick-image="${block.id}" aria-label="Add photos" title="Add photos"><i data-lucide="image-plus"></i></button></div>`;
    }
    function fileIcon(file) {
      const ext = (file.name || "").split(".").pop().toLowerCase();
      if (["pdf"].includes(ext)) return "file-text";
      if (["doc", "docx", "txt", "rtf", "md", "pages"].includes(ext)) return "file-text";
      if (["xls", "xlsx", "csv", "numbers"].includes(ext)) return "file-spreadsheet";
      if (["zip", "rar", "7z", "tar", "gz"].includes(ext)) return "file-archive";
      return "file";
    }

    function fileSub(f) { const ext = (f.name || "").split(".").pop().toUpperCase(); const size = formatBytes(f.size); return [ext && ext.length <= 5 ? ext : "FILE", size].filter(Boolean).join(" · "); }
    function fileCardHtml(block) {

    function ensureItems(block) {

    /* ============ Drag reordering ============ */
    function clearFolderDropState() { $$(".folder-item").forEach((i) => i.classList.remove("dragging", "drop-before", "drop-after")); }
    async function reorderFolder(draggedId, targetId, placement) {
      if (!draggedId || !targetId || draggedId === targetId || targetId === "all" || draggedId === "all") return;
      const ordered = sortFolders(state.folders);
      const dragged = ordered.find((f) => f.id === draggedId);
      const target = ordered.find((f) => f.id === targetId);
      if (!dragged || !target) return;
      const without = ordered.filter((f) => f.id !== draggedId);
      const targetGroup = without.filter((f) => !!f.pinnedAt === !!target.pinnedAt);
      const targetIndex = targetGroup.findIndex((f) => f.id === targetId);
      if (targetIndex === -1) return;
      dragged.pinnedAt = target.pinnedAt ? (dragged.pinnedAt || now()) : "";
      targetGroup.splice(placement === "after" ? targetIndex + 1 : targetIndex, 0, dragged);
      const otherGroup = without.filter((f) => !!f.pinnedAt !== !!target.pinnedAt);
      const nextOrder = target.pinnedAt ? [...targetGroup, ...otherGroup] : [...otherGroup, ...targetGroup];
      await Promise.all(nextOrder.map((f, i) => db.folders.update(f.id, { pinnedAt: f.pinnedAt || "", sortOrder: i, updatedAt: now() })));
      await loadAll();
    }
    function folderDropTargetFromPoint(x, y) {

      const rect = target.getBoundingClientRect();
      return { target, placement: y > rect.top + rect.height / 2 ? "after" : "before" };
    }
    function updateFolderPointerDrag(x, y) {
      clearFolderDropState();
      const current = folderDropTargetFromPoint(x, y);
      state.folderPointerDrag = { ...state.folderPointerDrag, targetId: current?.target?.dataset.folderId || null, placement: current?.placement || null };
      current?.target.classList.add(current.placement === "after" ? "drop-after" : "drop-before");
      $(`[data-folder-id="${CSS.escape(state.folderPointerDrag.folderId)}"]`)?.classList.add("dragging");

    async function attachBlob(blockId, blob, type, name, mimeType) {
      const id = uid();
      const attachment = { id, noteId: state.selectedNote.id, blockId, type, name, mimeType, blob, createdAt: now() };
      if (cloudReady()) {
        try {
          const path = `${currentUser.id}/${id}`;
          const { error } = await sb.storage.from("attachments").upload(path, blob, { contentType: mimeType || "application/octet-stream", upsert: true });
          if (!error) attachment.storagePath = path;
          else console.warn("upload failed", error.message);
        } catch (e) { console.warn("upload error", e); }
      }
      await db.attachments.add(attachment);
      return id;
    }
    // Returns a Blob for an attachment, fetching from Supabase Storage if it isn't cached locally.
    async function getAttachmentBlob(attachmentId) {
      if (!attachmentId) return null;
      const att = await db.attachments.get(attachmentId);
      if (att?.blob) return att.blob;
      if (!cloudReady()) return null;
      try {
        const path = att?.storagePath || `${currentUser.id}/${attachmentId}`;
        const { data, error } = await sb.storage.from("attachments").download(path);
        if (error || !data) return null;
        if (att) await db.attachments.update(attachmentId, { blob: data });
        return data;
      } catch { return null; }
    }

        try {
          const preview = await imageFileToPreview(file);
          const attachmentId = await attachBlob(block.id, file, "image", file.name, file.type || "application/octet-stream");
          images.push({ id: uid(), src: preview.src, fileName: file.name, previewName: preview.previewName, previewMimeType: preview.previewMimeType, wasConverted: preview.converted, previewError: "", attachmentId });
          if (preview.converted) convertedCount += 1;
        } catch {
          failedCount += 1;
          const attachmentId = await attachBlob(block.id, file, "image", file.name, file.type || "application/octet-stream");
          images.push({ id: uid(), src: "", fileName: file.name, previewName: "", previewMimeType: "", wasConverted: false, previewError: isHeicFile(file) ? "This HEIC file could not be converted in the browser." : "This photo could not be previewed.", attachmentId });
        }
      }
      setImageItems(block, images);
      return { convertedCount, failedCount };
    }

      const atts = await db.attachments.where("noteId").equals(target.id).toArray();
      if (cloudReady() && atts.length) { try { await sb.storage.from("attachments").remove(atts.map((a) => a.storagePath || `${currentUser.id}/${a.id}`)); } catch {} }
      await db.notes.delete(target.id);

    async function duplicateNote(noteId = state.selectedNote?.id) {
      const source = state.notes.find((n) => n.id === noteId);
      if (!source) return;
      const copy = structuredClone(source);
      const oldId = copy.id;
      copy.id = uid(); copy.title = `${copy.title || "Untitled"} copy`; copy.createdAt = now(); copy.updatedAt = now();
      copy.sortOrder = (Number.isFinite(source.sortOrder) ? source.sortOrder : 0) - 0.1;
      copy.blocks = copy.blocks.map((b) => ({ ...b, id: uid(), data: { ...b.data } }));
      await db.notes.add(copy);
      const attachments = await db.attachments.where("noteId").equals(oldId).toArray();
      const blockPairs = (source.blocks || []).map((ob, i) => [ob.id, copy.blocks[i].id]);
      for (const attachment of attachments) {
        const na = { ...attachment, id: uid(), noteId: copy.id, blockId: blockPairs.find(([oid]) => oid === attachment.blockId)?.[1] || copy.blocks[0].id };
        await db.attachments.add(na);
        const cb = copy.blocks.find((b) => b.id === na.blockId);
        if (cb?.data?.attachmentId === attachment.id) cb.data.attachmentId = na.id;
      }
      await db.notes.put(copy);
      state.selectedNoteId = copy.id;
      await loadAll();
      toast("Note duplicated");
    }

    function noteToText(note) {
      const lines = [`# ${note.title || "Untitled"}`, ""];
      const tags = noteTagObjects(note);
      if (tags.length) lines.push(`Tags: ${tags.map((t) => t.name).join(", ")}`, "");
      for (const block of note.blocks || []) {
        if (["paragraph", "heading", "checklist"].includes(block.type)) {
          const prefix = block.type === "checklist" ? (block.data.checked ? "[x] " : "[ ] ") : "";
          lines.push(prefix + stripTags(block.data.text || ""));
        } else if (block.type === "image") {
          for (const it of (block.data.items || [])) {
            if (it.kind === "text") { const tx = stripTags(it.text || "").trim(); if (tx) lines.push(tx); }
            else if (it.kind === "photos") lines.push(`[Photos] ${(it.images || []).length} image(s)`);
            else if (it.kind === "file") lines.push(`[File] ${it.name || ""}`.trim());
            else if (it.kind === "audio" || it.kind === "video") lines.push(`[${it.kind === "video" ? "Video" : "Audio"}] ${it.name || ""}`.trim());
          }
        }
        else if (block.type === "file") lines.push(`[File] ${block.data.name || ""}`.trim());
        else if (block.type === "video") lines.push(`[Video] ${stripTags(block.data.caption || "")}`.trim());
        else if (block.type === "audio" || block.type === "session") lines.push(`[${block.type === "session" ? "Full session" : "Voice clip"}] ${stripTags(block.data.caption || "")}`.trim());
        else if (block.type === "table") { lines.push("[Table]", (block.data.columns || []).join("\t")); (block.data.rows || []).forEach((row) => lines.push((block.data.columns || []).map((c) => row[c] ?? "").join("\t"))); }
        else if (block.type === "chart") lines.push(`[Chart] ${(block.data.labels || []).join(", ")} | ${(block.data.values || []).join(", ")}`);
        lines.push("");
      }
      return lines.join("\n");
    }

    /* ============ Import / export ============ */
    async function exportJson() {

    async function importJson(file) {
      const backup = JSON.parse(await file.text());
      if (!Array.isArray(backup.folders) || !Array.isArray(backup.notes)) throw new Error("Invalid backup");
      await db.transaction("rw", db.folders, db.notes, db.tags, db.attachments, async () => {
        await db.folders.clear(); await db.notes.clear(); await db.tags.clear(); await db.attachments.clear();
        await db.folders.bulkAdd(backup.folders);
        await db.notes.bulkAdd(backup.notes.map((n) => ({ ...n, tags: Array.isArray(n.tags) ? n.tags : [] })));
        if (Array.isArray(backup.tags) && backup.tags.length) await db.tags.bulkAdd(backup.tags);
        const attachments = await Promise.all((backup.attachments || []).map(async (a) => ({ ...a, blob: await dataUrlToBlob(a.blob) })));
        if (attachments.length) await db.attachments.bulkAdd(attachments);
      });
      state.selectedFolderId = "all"; state.selectedNoteId = null;
      await loadAll();

    function exportTxt(noteId = state.selectedNote?.id) {

    function downloadFile(name, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url; link.download = name; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function downloadBlob(blob, name) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url; link.download = name || "file"; link.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    function safeFileName(value) { return value.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "note"; }
    function blobToDataUrl(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); }
    function fileToDataUrl(file) { return blobToDataUrl(file); }
    function isHeicFile(file) { const n = (file.name || "").toLowerCase(), t = (file.type || "").toLowerCase(); return n.endsWith(".heic") || n.endsWith(".heif") || t.includes("heic") || t.includes("heif"); }
    async function imageFileToPreview(file) {
      if (!isHeicFile(file)) return { src: await fileToDataUrl(file), previewName: file.name, previewMimeType: file.type || "image/*", converted: false };
      if (typeof heic2any !== "function") throw new Error("HEIC converter is not available");
      const converted = await heic2any({ blob: file, toType: "image/jpeg", quality: 0.9 });
      const previewBlob = Array.isArray(converted) ? converted[0] : converted;
      return { src: await blobToDataUrl(previewBlob), previewName: file.name.replace(/\.(heic|heif)$/i, ".jpg"), previewMimeType: "image/jpeg", converted: true };
    }
    async function dataUrlToBlob(dataUrl) { return (await fetch(dataUrl)).blob(); }

    /* ============ Recording ============ */
    function pickAudioMime() {
      if (!window.MediaRecorder) return "";
      for (const t of ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus", "audio/ogg"]) {
        if (MediaRecorder.isTypeSupported(t)) return t;
      }
      return "";
    }
    let recTimer = null, recStart = 0;
    function setRecordBtn(html) { els.recordBtn.innerHTML = html; iconRefresh(); }
    function tickRecTimer() {
      const s = Math.max(0, Math.floor((Date.now() - recStart) / 1000));
      setRecordBtn(`<i data-lucide="square"></i><span>Stop ${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}</span>`);
    }
    function startRecTimer() { recStart = Date.now(); tickRecTimer(); recTimer = setInterval(tickRecTimer, 500); }
    function stopRecTimer() { clearInterval(recTimer); recTimer = null; els.recorder.classList.remove("is-recording"); setRecordBtn(`<i data-lucide="mic"></i><span>Record</span>`); }

    /* Live waveform/level meter while recording (also confirms the mic is being heard). */
    let meterCtx = null, meterAnalyser = null, meterRaf = null;
    function startMeter(stream) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        meterCtx = new AC();
        const src = meterCtx.createMediaStreamSource(stream);
        meterAnalyser = meterCtx.createAnalyser();
        meterAnalyser.fftSize = 64;
        meterAnalyser.smoothingTimeConstant = 0.6;
        src.connect(meterAnalyser);
        const canvas = $("#recWave"); if (!canvas) return;
        const ctx = canvas.getContext("2d");
        const bins = meterAnalyser.frequencyBinCount;
        const data = new Uint8Array(bins);
        const bars = 18, gap = 2;
        const render = () => {
          meterRaf = requestAnimationFrame(render);
          meterAnalyser.getByteFrequencyData(data);
          const w = canvas.width, h = canvas.height;
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = cssVar("--accent") || "#f97316";
          const bw = (w - gap * (bars - 1)) / bars;
          for (let i = 0; i < bars; i++) {
            const v = data[Math.floor(i * bins / bars)] / 255;
            const bh = Math.max(2, v * v * h);
            ctx.fillRect(i * (bw + gap), (h - bh) / 2, bw, bh);
          }
        };
        render();
      } catch {}
    }
    function stopMeter() {
      if (meterRaf) cancelAnimationFrame(meterRaf); meterRaf = null;
      if (meterCtx) { try { meterCtx.close(); } catch {} meterCtx = null; }
      meterAnalyser = null;
      const canvas = $("#recWave"); if (canvas) canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
    }

    // Re-encode a recorded blob to WAV (correct duration + universal playback). Falls back to the raw blob.
    function encodeWav(audioBuffer) {
      const sampleRate = audioBuffer.sampleRate;
      const n = audioBuffer.length;
      let samples = audioBuffer.getChannelData(0);
      if (audioBuffer.numberOfChannels > 1) {
        const a = audioBuffer.getChannelData(0), b = audioBuffer.getChannelData(1);
        samples = new Float32Array(n);
        for (let i = 0; i < n; i++) samples[i] = (a[i] + b[i]) / 2;
      }
      const buffer = new ArrayBuffer(44 + n * 2);
      const view = new DataView(buffer);
      const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
      writeStr(0, "RIFF"); view.setUint32(4, 36 + n * 2, true); writeStr(8, "WAVE");
      writeStr(12, "fmt "); view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true); view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
      writeStr(36, "data"); view.setUint32(40, n * 2, true);
      let off = 44;
      for (let i = 0; i < n; i++) { const s = Math.max(-1, Math.min(1, samples[i])); view.setInt16(off, s < 0 ? s * 0x8000 : s * 0x7FFF, true); off += 2; }
      return new Blob([view], { type: "audio/wav" });
    }
    async function toPlayableAudio(rawBlob) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) throw 0;
        const ac = new AC();
        const audioBuffer = await ac.decodeAudioData(await rawBlob.arrayBuffer());
        try { ac.close(); } catch {}
        if (!audioBuffer || !audioBuffer.length) throw 0;
        return { blob: encodeWav(audioBuffer), type: "audio/wav", ext: "wav" };
      } catch {
        const type = rawBlob.type || "audio/webm";
        return { blob: rawBlob, type, ext: type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm" };
      }
    }

    async function startRecording() {
      if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { toast("Recording isn't supported in this browser"); return; }
      if (!window.isSecureContext) { toast("Recording needs https:// or localhost"); return; }
      if (!state.selectedNote) { toast("Open a note first"); return; }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
      } catch (e) {
        toast(e?.name === "NotAllowedError" ? "Microphone permission was denied" : "Couldn't access the microphone");
        return;
      }
      const mime = pickAudioMime();
      let recorder;
      try { recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
      catch { try { recorder = new MediaRecorder(stream); } catch { stream.getTracks().forEach((t) => t.stop()); toast("Recording isn't supported in this browser"); return; } }
      const chunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
      recorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        stopMeter(); stopRecTimer();
        const rawType = recorder.mimeType || mime || "audio/webm";
        const raw = new Blob(chunks, { type: rawType });
        if (!raw.size) { toast("No audio captured — check your microphone input"); return; }
        const { blob, type, ext } = await toPlayableAudio(raw);
        const block = { id: uid(), type: "audio", data: { createdAt: now(), caption: "" } };
        const attachmentId = await attachBlob(block.id, blob, "audio", `recording-${Date.now()}.${ext}`, type);
        block.data.attachmentId = attachmentId;
        state.selectedNote.blocks.push(block);
        await saveNow();
        renderEditor();
        toast("Recording saved");
      };
      recorder.start(1000); // flush data every second so chunks aren't lost
      state.recording = recorder;
      els.recorder.classList.add("is-recording");
      startMeter(stream);
      startRecTimer();
    }
    function stopRecording() {
      if (!state.recording) return;
      try { state.recording.stop(); } catch {}
      state.recording = null;
      stopMeter(); stopRecTimer();
    }

    function renderTagManage() {

    /* ============ Global click handling ============ */
    document.addEventListener("click", async (event) => {
      if (state.suppressNextClick) { event.preventDefault(); event.stopPropagation(); state.suppressNextClick = false; return; }
      if (event.target.closest("[data-note-title]")) { event.stopPropagation(); return; }

      const t = event.target;

      // settings interactions
      const themeChoice = t.closest("[data-theme-choice]");
      if (themeChoice) { prefs.theme = themeChoice.dataset.themeChoice; applyTheme(); $$("#themeSeg button").forEach((b) => b.classList.toggle("active", b === themeChoice)); renderEditor(); return; }
      const accentChoice = t.closest("[data-accent-choice]");
      if (accentChoice) { prefs.accent = accentChoice.dataset.accentChoice; applyAccent(); $$("#accentRow .swatch").forEach((b) => b.classList.toggle("active", b === accentChoice)); renderEditor(); return; }
      const setColor = t.closest("[data-set-tag-color]");
      if (setColor) { const [id, color] = setColor.dataset.setTagColor.split(":"); await setTagColor(id, color); renderTagManage(); return; }
      if (t.closest("#settingsAddTag")) { const tag = await createTag(); if (tag) { renderTagManage(); renderTags(); } return; }
      if (t.closest("#settingsDone")) { els.settingsModal.classList.add("hidden"); return; }
      if (t === els.settingsModal) { els.settingsModal.classList.add("hidden"); return; }

      // popover content actions
      const switchFolder = t.closest("[data-switch-folder]");
      if (switchFolder) { state.selectedFolderId = switchFolder.dataset.switchFolder; closePopover(); renderAll(); return; }
      const toggleNT = t.closest("[data-toggle-note-tag]");
      if (toggleNT) { await toggleNoteTag(state.selectedNote.id, toggleNT.dataset.toggleNoteTag); openNoteTagPicker($("#addNoteTagBtn") || els.noteTagsEdit); return; }
      if (t.closest("[data-create-note-tag]")) { const tag = await createTag(); if (tag && state.selectedNote) await toggleNoteTag(state.selectedNote.id, tag.id); closePopover(); return; }
      const sortChoice = t.closest("[data-sort]");
      if (sortChoice) { state.sortMode = sortChoice.dataset.sort; prefs.sort = state.sortMode; renderNotes(); $$("#popover [data-sort]").forEach((b) => b.classList.toggle("active", b === sortChoice)); return; }
      const filterType = t.closest("[data-filter-type]");
      if (filterType) { const ty = filterType.dataset.filterType; state.filterTypes.has(ty) ? state.filterTypes.delete(ty) : state.filterTypes.add(ty); filterType.classList.toggle("active"); renderNotes(); renderFilterState(); return; }
      const filterTag = t.closest("[data-filter-tag]");
      if (filterTag) { toggleTagFilter(filterTag.dataset.filterTag); filterTag.classList.toggle("active"); return; }
      if (t.closest("[data-clear-filters]")) { state.filterTagIds.clear(); state.filterTypes.clear(); closePopover(); renderTags(); renderNotes(); renderFilterState(); return; }

      const folderMove = t.closest("[data-folder-move]");
      if (folderMove) { event.stopPropagation(); await moveNoteToFolder(els.popover.dataset.noteId, folderMove.dataset.folderMove); return; }
      const noteAction = t.closest("[data-note-action]");
      if (noteAction) {
        event.stopPropagation();
        const action = noteAction.dataset.noteAction, noteId = els.popover.dataset.noteId;
        if (action === "move") { openMoveMenu(noteId, els.popover); return; }
        closePopover();
        if (action === "pin") await toggleNotePin(noteId);
        else if (action === "rename") await renameNote(noteId);
        else if (action === "duplicate") await duplicateNote(noteId);
        else if (action === "share") await shareNote(noteId);
        else if (action === "export") exportTxt(noteId);
        else if (action === "delete") await deleteNote(noteId);
        return;
      }

      // note tag remove / add
      const removeTag = t.closest("[data-remove-tag]");
      if (removeTag && state.selectedNote) { event.stopPropagation(); await toggleNoteTag(state.selectedNote.id, removeTag.dataset.removeTag); return; }
      if (t.closest("#addNoteTagBtn")) { event.stopPropagation(); openNoteTagPicker(t.closest("#addNoteTagBtn")); return; }

      // sidebar tag interactions
      const renameTagBtn = t.closest("[data-rename-tag]");
      if (renameTagBtn) { event.stopPropagation(); await renameTag(renameTagBtn.dataset.renameTag); return; }
      const deleteTagBtn = t.closest("[data-delete-tag]");
      if (deleteTagBtn) { event.stopPropagation(); if (confirm("Delete this tag? It will be removed from all notes.")) await deleteTag(deleteTagBtn.dataset.deleteTag); if (!els.settingsModal.classList.contains("hidden")) renderTagManage(); return; }
      const tagFilter = t.closest("[data-tag-filter]");
      if (tagFilter) { toggleTagFilter(tagFilter.dataset.tagFilter); closeDrawer(); return; }

      // block & note menus
      const noteMenu = t.closest("[data-note-menu]");
      if (noteMenu) { event.preventDefault(); event.stopPropagation(); openNoteMenu(noteMenu.dataset.noteMenu, noteMenu); return; }
      if (t.closest("#noteMenuBtn")) { event.preventDefault(); event.stopPropagation(); if (state.selectedNote) openNoteMenu(state.selectedNote.id, $("#noteMenuBtn")); return; }
      if (t.closest("#filterBtn")) { event.stopPropagation(); openFilterPopover($("#filterBtn")); return; }
      if (t.closest("#folderSwitcher")) { event.stopPropagation(); openFolderSwitcher($("#folderSwitcher")); return; }

      const blockDelete = t.closest("[data-block-delete]");
      if (blockDelete && state.selectedNote) { event.preventDefault(); event.stopPropagation(); state.selectedNote.blocks = state.selectedNote.blocks.filter((b) => b.id !== blockDelete.dataset.blockDelete); await saveNow(); renderEditor(); return; }

      // ----- ordered photo-block items -----
      const addItemImage = t.closest("[data-add-item-image]");
      if (addItemImage) { event.preventDefault(); event.stopPropagation(); const [blockId, itemId] = addItemImage.dataset.addItemImage.split(":"); pickImage(blockId, itemId); return; }
      const delItemImage = t.closest("[data-del-item-image]");
      if (delItemImage && state.selectedNote) {
        event.preventDefault(); event.stopPropagation();
        const [blockId, itemId, idx] = delItemImage.dataset.delItemImage.split(":");
        const block = blockById(blockId); const item = block && itemById(block, itemId); if (!item) return;
        item.images.splice(Number(idx), 1);
        if (!item.images.length) block.data.items = block.data.items.filter((it) => it.id !== itemId);
        ensureTrailingText(block.data.items);
        await saveNow(); renderEditor(); toast("Photo removed"); return;
      }
      const viewItem = t.closest("[data-view-item]");
      if (viewItem) {
        event.preventDefault(); event.stopPropagation();
        const [blockId, itemId, idx] = viewItem.dataset.viewItem.split(":");
        await openLightboxItem(blockId, itemId, Number(idx)); return;
      }
      const openItemFile = t.closest("[data-open-item-file]");
      if (openItemFile && state.selectedNote) {
        event.preventDefault(); event.stopPropagation();
        const [blockId, itemId] = openItemFile.dataset.openItemFile.split(":");
        const item = itemById(blockById(blockId) || {}, itemId);
        if (item?.attachmentId) { const blob = await getAttachmentBlob(item.attachmentId); if (blob) downloadBlob(blob, item.name); else toast("File data not found"); }
        return;
      }
      const delItem = t.closest("[data-del-item]");
      if (delItem && state.selectedNote) {
        event.preventDefault(); event.stopPropagation();
        const [blockId, itemId] = delItem.dataset.delItem.split(":");
        const block = blockById(blockId); if (!block) return;
        block.data.items = (block.data.items || []).filter((it) => it.id !== itemId);
        ensureTrailingText(block.data.items);
        await saveNow(); renderEditor(); toast("Removed"); return;
      }

      const deleteImage = t.closest("[data-delete-image]");
      if (deleteImage && state.selectedNote) {
        event.preventDefault(); event.stopPropagation();
        const [blockId, idx] = deleteImage.dataset.deleteImage.split(":");
        const block = blockById(blockId); if (!block) return;
        const images = imageItems(block); images.splice(Number(idx), 1); setImageItems(block, images);
        await saveNow(); renderEditor(); toast("Photo removed"); return;
      }
      const openFileBlock = t.closest("[data-open-file-block]");
      if (openFileBlock && state.selectedNote) {
        event.preventDefault(); event.stopPropagation();
        const block = blockById(openFileBlock.dataset.openFileBlock);
        if (block?.data.attachmentId) { const blob = await getAttachmentBlob(block.data.attachmentId); if (blob) downloadBlob(blob, block.data.name); else toast("File data not found"); }
        return;
      }
      const openFile = t.closest("[data-open-file]");
      if (openFile && state.selectedNote) {
        event.preventDefault(); event.stopPropagation();
        const [blockId, idx] = openFile.dataset.openFile.split(":");
        const file = blockById(blockId)?.data.files?.[Number(idx)];
        if (file) { const blob = await getAttachmentBlob(file.attachmentId); if (blob) downloadBlob(blob, file.name); else toast("File data not found"); }
        return;
      }
      const deleteFile = t.closest("[data-delete-file]");
      if (deleteFile && state.selectedNote) {
        event.preventDefault(); event.stopPropagation();
        const [blockId, idx] = deleteFile.dataset.deleteFile.split(":");
        const block = blockById(blockId); if (!block?.data.files) return;
        block.data.files.splice(Number(idx), 1);
        await saveNow(); renderEditor(); toast("Removed"); return;
      }
      const viewImage = t.closest("[data-view-image]");
      if (viewImage) {
        event.preventDefault(); event.stopPropagation();
        const [blockId, idx] = viewImage.dataset.viewImage.split(":");
        await openLightbox(blockId, Number(idx)); return;
      }
      const attachFile = t.closest("[data-attach-file]");
      if (attachFile) { event.preventDefault(); event.stopPropagation(); pickAttachmentInto(attachFile.dataset.attachFile); return; }
      const insertItem = t.closest("[data-insert]");
      if (insertItem) {
        event.preventDefault(); event.stopPropagation();
        const type = insertItem.dataset.insert;
        const anchorId = els.popover.dataset.anchorId;
        closePopover();
        await insertBlockAfter(anchorId, type);
        return;
      }
      const blockAdd = t.closest("[data-block-add]");
      if (blockAdd) { event.preventDefault(); event.stopPropagation(); openInsertMenu(blockAdd.dataset.blockAdd, blockAdd); return; }

      if (!t.closest("#popover")) closePopover();

      const folderDelete = t.closest("[data-delete-folder]");
      if (folderDelete) { event.preventDefault(); event.stopPropagation(); await deleteFolder(folderDelete.dataset.deleteFolder); return; }
      const folderPin = t.closest("[data-pin-folder]");
      if (folderPin) { event.preventDefault(); event.stopPropagation(); await toggleFolderPin(folderPin.dataset.pinFolder); return; }
      const folderRename = t.closest("[data-rename-folder]");
      if (folderRename) { event.preventDefault(); event.stopPropagation(); await renameFolder(folderRename.dataset.renameFolder); return; }
      const folder = t.closest("[data-folder-id]");
      if (folder) { state.selectedFolderId = folder.dataset.folderId; closeDrawer(); renderAll(); return; }
      const note = t.closest("[data-note-id]");
      if (note) { await selectNote(note.dataset.noteId); return; }

      const add = t.closest("[data-add-block]");
      if (add) {
        if (add.dataset.addBlock === "file") { if (!state.selectedNote) { toast("Open a note first"); return; } pickAttachmentNew(""); return; }
        await addBlock(add.dataset.addBlock); return;
      }
      const pick = t.closest("[data-pick-image]");
      if (pick) { pickImage(pick.dataset.pickImage); return; }

      const tableRow = t.closest("[data-table-row]");
      if (tableRow) { const block = blockById(tableRow.dataset.tableRow); const row = Object.fromEntries((block.data.columns || []).map((c) => [c, ""])); state.tableInstances.get(block.id)?.addRow(row); block.data.rows = state.tableInstances.get(block.id)?.getData() || block.data.rows; queueSave(); return; }
      const tableColumn = t.closest("[data-table-column]");
      if (tableColumn) {
        const block = blockById(tableColumn.dataset.tableColumn);
        const name = await askForText({ title: "New column", value: `Column ${block.data.columns.length + 1}`, placeholder: "Column name" });
        if (!name) return;
        block.data.columns.push(name.trim());
        block.data.rows = (block.data.rows || []).map((r) => ({ ...r, [name.trim()]: "" }));
        await saveNow(); renderEditor(); return;
      }
      const chartFromTable = t.closest("[data-chart-from-table]");
      if (chartFromTable) {
        const tb = blockById(chartFromTable.dataset.chartFromTable);
        const columns = tb.data.columns || [];
        const chart = makeBlock("chart");
        chart.data.labels = (tb.data.rows || []).map((r) => r[columns[0]] || "");
        chart.data.values = (tb.data.rows || []).map((r) => Number(String(r[columns[1]]).replace(/[^0-9.-]/g, "")) || 0);
        chart.data.title = tb.data.title || "Chart";
        state.selectedNote.blocks.push(chart);
        await saveNow(); renderEditor();
      }
    });

    /* ============ Pointer drag ============ */
    document.addEventListener("pointerdown", (event) => {
      if (event.button !== 0) return;
      if (event.target.closest("button, input, select, textarea, audio, .editable, [contenteditable]")) return;
      const folderRow = event.target.closest("[data-folder-id]");
      const noteRow = event.target.closest("[data-note-id]");
      const blockRow = event.target.closest("[data-block-id]");
      if (!folderRow && !noteRow && !blockRow) return;
      if (folderRow && folderRow.dataset.folderId === "all") return;
      event.target.setPointerCapture?.(event.pointerId);
      state.dragCandidate = { pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, folderId: folderRow?.dataset.folderId || null, noteId: noteRow?.dataset.noteId || null, blockId: blockRow?.dataset.blockId || null, started: false };
    });
    document.addEventListener("pointermove", (event) => {
      const c = state.dragCandidate;
      if (c && c.pointerId === event.pointerId && !c.started) {
        if (Math.hypot(event.clientX - c.startX, event.clientY - c.startY) < 7) return;
        c.started = true; state.suppressNextClick = true; document.getSelection()?.removeAllRanges();
        if (c.folderId) state.folderPointerDrag = { folderId: c.folderId, targetId: null, placement: null };
        if (c.noteId) state.notePointerDrag = { noteId: c.noteId, targetId: null, placement: null };
        if (c.blockId) state.blockPointerDrag = { blockId: c.blockId, targetId: null, placement: null };
      }
      if (!state.folderPointerDrag && !state.notePointerDrag && !state.blockPointerDrag) return;
      event.preventDefault();
      if (state.folderPointerDrag) updateFolderPointerDrag(event.clientX, event.clientY);
      if (state.notePointerDrag) updateNotePointerDrag(event.clientX, event.clientY);
      if (state.blockPointerDrag) updateBlockPointerDrag(event.clientX, event.clientY);
    });
    document.addEventListener("pointerup", async () => {
      const had = !!(state.folderPointerDrag || state.notePointerDrag || state.blockPointerDrag);
      if (!had) { state.dragCandidate = null; return; }
      const fd = state.folderPointerDrag, nd = state.notePointerDrag, bd = state.blockPointerDrag;
      state.dragCandidate = null; state.folderPointerDrag = null; state.notePointerDrag = null; state.blockPointerDrag = null;
      clearFolderDropState(); clearNoteDropState(); clearBlockDropState();
      if (fd?.targetId && fd?.placement) await reorderFolder(fd.folderId, fd.targetId, fd.placement);
      if (nd?.targetId && nd?.placement) await reorderNote(nd.noteId, nd.targetId, nd.placement);
      if (bd?.targetId && bd?.placement) await reorderBlock(bd.blockId, bd.targetId, bd.placement);
      setTimeout(() => { state.suppressNextClick = false; }, 0);
    });
    document.addEventListener("pointercancel", () => {
      state.dragCandidate = null; state.folderPointerDrag = null; state.notePointerDrag = null; state.blockPointerDrag = null;
      clearFolderDropState(); clearNoteDropState(); clearBlockDropState();
    });

    /* ============ Inputs ============ */
    els.titleInput.addEventListener("input", () => { if (!state.selectedNote) return; state.selectedNote.title = els.titleInput.value; queueSave(); });
    els.notesList.addEventListener("input", (event) => {
      const title = event.target.closest("[data-note-title]");
      if (!title) return;
      const note = state.notes.find((n) => n.id === title.dataset.noteTitle);
      if (!note) return;
      note.title = title.textContent.trim() || "Untitled"; note.updatedAt = now();
      if (state.selectedNote?.id === note.id) { state.selectedNote.title = note.title; els.titleInput.value = note.title; }
      clearTimeout(state.noteTitleTimers.get(note.id));
      state.noteTitleTimers.set(note.id, setTimeout(async () => { await db.notes.put(note); renderFolderSelect(); setSaveState(); }, 350));
    });
    els.notesList.addEventListener("keydown", (event) => { if (!event.target.closest("[data-note-title]")) return; if (event.key === "Enter") { event.preventDefault(); event.target.blur(); } });

    els.blocks.addEventListener("input", (event) => {
      const blockEl = event.target.closest("[data-block-id]");
      if (!blockEl) return;
      const block = blockById(blockEl.dataset.blockId);
      if (!block) return;
      if (event.target.matches("[data-item-text]")) {
        const itemId = event.target.dataset.itemText.split(":")[1];
        const item = itemById(block, itemId);
        if (item) item.text = event.target.innerHTML;
      } else if (event.target.matches("[contenteditable]") && event.target.dataset.field) {
        block.data[event.target.dataset.field] = event.target.innerHTML;
      }
      if (event.target.matches("[data-field='checked']")) { block.data.checked = event.target.checked; event.target.closest(".check-block")?.classList.toggle("done", event.target.checked); }
      if (event.target.matches("[data-chart-type]")) { block.data.chartType = event.target.value; refreshChartBlock(block); }
      if (event.target.matches("[data-chart-labels]")) { block.data.labels = event.target.value.split(",").map((i) => i.trim()).filter(Boolean); refreshChartBlock(block); }
      if (event.target.matches("[data-chart-values]")) { block.data.values = event.target.value.split(",").map((i) => Number(i.trim()) || 0); refreshChartBlock(block); }
      queueSave();
    });
    els.blocks.addEventListener("change", (event) => {
      if (!event.target.matches("[data-chart-type]")) return;
      const blockEl = event.target.closest("[data-block-id]");
      const block = blockById(blockEl?.dataset.blockId);
      if (block) { block.data.chartType = event.target.value; refreshChartBlock(block); queueSave(); }
    });

    els.moveFolderSelect.addEventListener("change", async () => { if (!state.selectedNote) return; state.selectedNote.folderId = els.moveFolderSelect.value; await saveNow(); renderFolders(); toast("Note moved"); });

    $("#newFolderBtn").addEventListener("click", createFolder);

    $("#addTagSidebar").addEventListener("click", async () => { const tag = await createTag(); if (tag) renderTags(); });
    els.pinBtn.addEventListener("click", () => toggleNotePin());
    $("#shareBtn").addEventListener("click", () => shareNote());
    $("#exportJsonBtn").addEventListener("click", exportJson);
    $("#exportTxtBtn").addEventListener("click", () => exportTxt());
    $("#importBtn").addEventListener("click", () => els.importInput.click());
    $("#menuBtn").addEventListener("click", openDrawer);
    $("#drawerBackdrop").addEventListener("click", closeDrawer);
    $("#backToListBtn").addEventListener("click", mobileShowList);
    $("#newNoteMobile").addEventListener("click", () => createNote());
    $("#settingsBtn").addEventListener("click", openSettings);

    $("#syncChip").addEventListener("click", () => { if (cloudReady()) { toast("Syncing…"); pushSnapshot(); } });
    $("#clearFilterBanner").addEventListener("click", () => { state.filterTagIds.clear(); state.filterTypes.clear(); renderTags(); renderNotes(); renderFilterState(); });
    els.themeToggle.addEventListener("click", () => {
      const dark = document.documentElement.dataset.theme === "dark";
      prefs.theme = dark ? "light" : "dark"; applyTheme(); renderEditor();
    });
    els.recordBtn.addEventListener("click", () => state.recording ? stopRecording() : startRecording());

    $("#settingsName").addEventListener("input", (e) => { prefs.name = e.target.value || "David"; renderProfile(); });

    els.imageInput.addEventListener("change", async () => {
      const files = Array.from(els.imageInput.files || []);
      const block = blockById(els.imageInput.dataset.blockId);
      if (!files.length || !block) { els.imageInput.value = ""; els.imageInput.dataset.itemId = ""; return; }
      try {
        setSaveState("Saving...");
        if (block.type === "image") {
          ensureItems(block);
          const items = block.data.items;
          const itemId = els.imageInput.dataset.itemId;
          let group = itemId ? itemById(block, itemId) : items.find((it) => it.kind === "photos");
          if (!group || group.kind !== "photos") {
            group = { id: uid(), kind: "photos", images: [] };
            let pos = items.length;
            while (pos > 0 && items[pos - 1].kind === "text" && !String(items[pos - 1].text).trim()) pos--;
            items.splice(pos, 0, group);
          }
          const newImgs = await filesToImageItems(block.id, files);
          group.images = (group.images || []).concat(newImgs);
          ensureTrailingText(items);
          await saveNow(); renderEditor();
          toast(files.length > 1 ? `${files.length} photos added` : "Photo added");
        } else {
          const { convertedCount, failedCount } = await addImagesToBlock(block, files);
          await saveNow(); renderEditor();
          if (failedCount) toast(`${failedCount} photo${failedCount > 1 ? "s" : ""} could not preview`);
          else if (convertedCount) toast(`${convertedCount} HEIC photo${convertedCount > 1 ? "s" : ""} converted`);
          else toast(files.length > 1 ? `${files.length} photos added` : "Photo added");
        }
      } catch { toast("Could not add those photos"); }
      finally { els.imageInput.value = ""; els.imageInput.dataset.itemId = ""; }
    });

    function resetAttachInput() { els.attachInput.value = ""; els.attachInput.dataset.mode = ""; els.attachInput.dataset.blockId = ""; els.attachInput.dataset.anchorId = ""; }
    els.attachInput.addEventListener("change", async () => {
      const files = Array.from(els.attachInput.files || []);
      if (!files.length || !state.selectedNote) { resetAttachInput(); return; }
      const mode = els.attachInput.dataset.mode || "into";
      try {
        setSaveState("Saving...");
        if (mode === "into") {
          const block = blockById(els.attachInput.dataset.blockId);
          if (!block) { resetAttachInput(); return; }
          let photoCount = 0, docCount = 0, clipCount = 0;
          if (block.type === "image") {
            // Append everything to the END of the ordered block, below existing content.
            ensureItems(block);
            const items = block.data.items;
            while (items.length && items[items.length - 1].kind === "text" && !String(items[items.length - 1].text).trim()) items.pop();
            let i = 0;
            while (i < files.length) {
              if (isImageFile(files[i])) {
                const run = [];
                while (i < files.length && isImageFile(files[i])) run.push(files[i++]);
                items.push({ id: uid(), kind: "photos", images: await filesToImageItems(block.id, run) });
                photoCount += run.length;
              } else {
                const file = files[i++];
                const mt = (file.type || "").toLowerCase();
                const isVideo = mt.startsWith("video") || /\.(mp4|mov|webm|m4v|avi|mkv)$/i.test(file.name);
                const isAudio = mt.startsWith("audio") || /\.(mp3|wav|m4a|aac|ogg|webm|flac)$/i.test(file.name);
                const kind = isVideo ? "video" : isAudio ? "audio" : "file";
                const attachmentId = await attachBlob(block.id, file, "file", file.name, file.type || "application/octet-stream");
                items.push({ id: uid(), kind, attachmentId, name: file.name, mimeType: file.type || "", size: file.size || 0 });
                kind === "file" ? docCount++ : clipCount++;
              }
            }
            ensureTrailingText(items);
          } else {
            const imageFiles = files.filter(isImageFile);
            if (imageFiles.length) { await addImagesToBlock(block, imageFiles); photoCount += imageFiles.length; }
            block.data.files = block.data.files || [];
            for (const file of files.filter((f) => !isImageFile(f))) {
              const attachmentId = await attachBlob(block.id, file, "file", file.name, file.type || "application/octet-stream");
              block.data.files.push({ id: uid(), attachmentId, name: file.name, mimeType: file.type || "", size: file.size || 0 });
              ((file.type || "").startsWith("audio") || (file.type || "").startsWith("video")) ? clipCount++ : docCount++;
            }
          }
          await saveNow(); renderEditor();
          const parts = [];
          if (photoCount) parts.push(`${photoCount} photo${photoCount > 1 ? "s" : ""}`);
          if (clipCount) parts.push(`${clipCount} clip${clipCount > 1 ? "s" : ""}`);
          if (docCount) parts.push(`${docCount} file${docCount > 1 ? "s" : ""}`);
          toast(parts.length ? `Added ${parts.join(", ")}` : "Added");
        } else {
          // Standalone blocks (bottom File button): photos -> image block, docs -> file block, clips -> media block.
          const blocks = state.selectedNote.blocks;
          const anchorId = els.attachInput.dataset.anchorId;
          const anchorIndex = anchorId ? blocks.findIndex((b) => b.id === anchorId) : -1;
          let insertAt = anchorIndex >= 0 ? anchorIndex + 1 : blocks.length;
          let photoCount = 0, docCount = 0, mediaCount = 0, i = 0;
          while (i < files.length) {
            if (isImageFile(files[i])) {
              const run = [];
              while (i < files.length && isImageFile(files[i])) run.push(files[i++]);
              const nb = { id: uid(), type: "image", data: { caption: "", images: [] } };
              blocks.splice(insertAt++, 0, nb);
              await addImagesToBlock(nb, run);
              photoCount += run.length;
            } else {
              const file = files[i++];
              const isVideo = (file.type || "").startsWith("video") || /\.(mp4|mov|webm|m4v|avi|mkv)$/i.test(file.name);
              const isAudio = (file.type || "").startsWith("audio") || /\.(mp3|wav|m4a|aac|ogg|webm|flac)$/i.test(file.name);
              if (isVideo || isAudio) {
                const type = isVideo ? "video" : "audio";
                const nb = { id: uid(), type, data: { createdAt: now(), caption: "", images: [] } };
                nb.data.attachmentId = await attachBlob(nb.id, file, type, file.name, file.type || (isVideo ? "video/mp4" : "audio/mpeg"));
                blocks.splice(insertAt++, 0, nb);
                mediaCount++;
              } else {
                const nb = { id: uid(), type: "file", data: { createdAt: now(), name: file.name, mimeType: file.type || "", size: file.size || 0 } };
                nb.data.attachmentId = await attachBlob(nb.id, file, "file", file.name, file.type || "application/octet-stream");
                blocks.splice(insertAt++, 0, nb);
                docCount++;
              }
            }
          }
          await saveNow(); renderEditor();
          const parts = [];
          if (photoCount) parts.push(`${photoCount} photo${photoCount > 1 ? "s" : ""}`);
          if (mediaCount) parts.push(`${mediaCount} clip${mediaCount > 1 ? "s" : ""}`);
          if (docCount) parts.push(`${docCount} file${docCount > 1 ? "s" : ""}`);
          toast(parts.length ? `Added ${parts.join(", ")}` : "Added");
        }
      } catch { toast("Could not attach those files"); }
      finally { resetAttachInput(); }
    });
    els.mediaInput.addEventListener("change", async () => {
      const files = Array.from(els.mediaInput.files || []);
      if (!files.length || !state.selectedNote) { els.mediaInput.value = ""; els.mediaInput.dataset.anchorId = ""; return; }
      const blocks = state.selectedNote.blocks;
      const anchorId = els.mediaInput.dataset.anchorId;
      const anchorIndex = anchorId ? blocks.findIndex((b) => b.id === anchorId) : -1;
      let insertAt = anchorIndex >= 0 ? anchorIndex + 1 : blocks.length;
      let videoCount = 0, audioCount = 0;
      try {
        setSaveState("Saving...");
        for (const file of files) {
          const isVideo = (file.type || "").startsWith("video") || /\.(mp4|mov|webm|m4v|avi|mkv)$/i.test(file.name);
          const type = isVideo ? "video" : "audio";
          const block = { id: uid(), type, data: { createdAt: now(), caption: "", images: [] } };
          const attachmentId = await attachBlob(block.id, file, type, file.name, file.type || (isVideo ? "video/mp4" : "audio/mpeg"));
          block.data.attachmentId = attachmentId;
          blocks.splice(insertAt++, 0, block);
          isVideo ? videoCount++ : audioCount++;
        }
        await saveNow(); renderEditor();
        const parts = [];
        if (videoCount) parts.push(`${videoCount} video${videoCount > 1 ? "s" : ""}`);
        if (audioCount) parts.push(`${audioCount} recording${audioCount > 1 ? "s" : ""}`);
        toast(`Added ${parts.join(" & ")}`);
      } catch { toast("Could not add that media"); }
      finally { els.mediaInput.value = ""; els.mediaInput.dataset.anchorId = ""; }
    });
    els.importInput.addEventListener("change", async () => {
      const file = els.importInput.files[0];
      if (!file) return;
      try { await importJson(file); } catch { toast("Could not import that backup"); } finally { els.importInput.value = ""; }
    });

    $("#lbClose").addEventListener("click", closeLightbox);
    $("#lbPrev").addEventListener("click", () => showLightbox(lb.index - 1));
    $("#lbNext").addEventListener("click", () => showLightbox(lb.index + 1));
    $("#lightbox").addEventListener("click", (e) => { if (e.target.id === "lightbox") closeLightbox(); });
    document.addEventListener("keydown", (e) => {
      const lightboxOpen = !$("#lightbox").classList.contains("hidden");
      if (lightboxOpen) {
        if (e.key === "Escape") closeLightbox();
        else if (e.key === "ArrowLeft") showLightbox(lb.index - 1);
        else if (e.key === "ArrowRight") showLightbox(lb.index + 1);
        return;
      }
      if (e.key === "Escape") { closePopover(); els.settingsModal.classList.add("hidden"); }
    });
    window.addEventListener("resize", () => closePopover());
    window.addEventListener("beforeunload", () => { if (state.recording) state.recording.stop(); });

    /* ============================================================
       Cloud sync (Supabase) — per-user snapshot + Storage for files
       ============================================================ */
    function scheduleSync() {
      if (!cloudReady() || !syncReady) return;
      setSyncState("Saving…");
      clearTimeout(syncTimer);
      syncTimer = setTimeout(pushSnapshot, 1500);
    }
    // state: "ok" | "busy" | "err"
    function setSyncState(text, state = "ok") {
      const el = $("#settingsSyncState"); if (el) el.textContent = text;
      const chip = $("#syncChip");
      if (chip) {
        chip.classList.toggle("hidden", !cloudConfigured);
        chip.classList.remove("ok", "busy", "err"); chip.classList.add(state);
        const txt = $("#syncChipText"); if (txt) txt.textContent = text;
      }
    }

    // Upload any local attachment blobs that aren't in Storage yet (recorded/imported while offline).
    async function uploadPendingAttachments() {
      if (!cloudReady()) return 0;
      const all = await db.attachments.toArray();
      const pending = all.filter((a) => a.blob && !a.storagePath);
      if (!pending.length) return 0;
      let done = 0;
      for (const a of pending) {
        setSyncState(`Uploading files… ${done + 1}/${pending.length}`, "busy");
        const path = `${currentUser.id}/${a.id}`;
        try {
          const { error } = await sb.storage.from("attachments").upload(path, a.blob, { contentType: a.mimeType || "application/octet-stream", upsert: true });
          if (!error) { await db.attachments.update(a.id, { storagePath: path }); done++; }
          else console.warn("upload failed", a.name, error.message);
        } catch (e) { console.warn("upload error", a.name, e); }
      }
      return done;
    }

    // Strip heavy base64 image previews before sending to the cloud (the bytes live in Storage).
    function stripHeavy(notes) {
      return notes.map((n) => {
        const c = structuredClone(n);
        for (const b of (c.blocks || [])) {
          if (Array.isArray(b.data.items)) for (const it of b.data.items) if (it.kind === "photos") for (const img of (it.images || [])) img.src = "";
          if (Array.isArray(b.data.images)) for (const img of b.data.images) img.src = "";
          if (b.data.src) b.data.src = "";
        }
        return c;
      });
    }

    async function pushSnapshot() {
      if (!cloudReady()) return;
      try {
        setSyncState("Syncing…", "busy");
        await uploadPendingAttachments();
        const attachments = (await db.attachments.toArray()).map((a) => ({ id: a.id, noteId: a.noteId, blockId: a.blockId, type: a.type, name: a.name, mimeType: a.mimeType, storagePath: a.storagePath || `${currentUser.id}/${a.id}`, createdAt: a.createdAt }));
        const data = { v: 1, folders: state.folders, notes: stripHeavy(state.notes), tags: state.tags, attachments, updatedAt: now() };
        const { error } = await sb.from("app_snapshots").upsert({ user_id: currentUser.id, data, updated_at: new Date().toISOString() });
        if (error) { console.warn("sync push failed", error.message); setSyncState("Sync error — tap to retry", "err"); clearTimeout(syncTimer); syncTimer = setTimeout(pushSnapshot, 6000); }
        else setSyncState("All changes synced", "ok");
      } catch (e) { console.warn("sync push error", e); setSyncState("Sync error — tap to retry", "err"); }
    }
    async function fetchSnapshot() {
      const { data, error } = await sb.from("app_snapshots").select("data").eq("user_id", currentUser.id).maybeSingle();
      if (error) { console.warn("sync fetch failed", error.message); return null; }
      return data?.data || null;
    }
    async function loadSnapshotIntoDexie(remote) {
      await db.transaction("rw", db.folders, db.notes, db.tags, db.attachments, async () => {
        await db.folders.clear(); await db.notes.clear(); await db.tags.clear();
        if (remote.folders?.length) await db.folders.bulkAdd(remote.folders);
        if (remote.notes?.length) await db.notes.bulkAdd(remote.notes);
        if (remote.tags?.length) await db.tags.bulkAdd(remote.tags);
        for (const m of (remote.attachments || [])) {
          const ex = await db.attachments.get(m.id);
          if (ex) await db.attachments.update(m.id, { storagePath: m.storagePath || ex.storagePath });
          else await db.attachments.add({ ...m, blob: undefined });
        }
      });
    }
    async function initialSync() {
      setSyncState("Syncing…");
      let remote = null;
      try { remote = await fetchSnapshot(); } catch (e) { console.warn(e); }
      if (remote && Array.isArray(remote.notes)) await loadSnapshotIntoDexie(remote);
      await loadAll();
      if (!remote || !Array.isArray(remote.notes)) { await pushSnapshot(); } // first login: seed cloud from local
      syncReady = true;
      setSyncState("All changes synced");
    }

    /* ---------- Auth UI ---------- */
    let authMode = "login";
    const authEls = {
      gate: $("#authGate"), form: $("#authForm"), title: $("#authTitle"), sub: $("#authSub"),
      email: $("#authEmail"), pw: $("#authPassword"), pw2: $("#authPassword2"),
      submit: $("#authSubmit"), error: $("#authError"), note: $("#authNote"),
      switchText: $("#authSwitchText"), switchBtn: $("#authSwitchBtn")
    };
    function showAuth() { authEls.gate.classList.remove("hidden"); iconRefresh(); }
    function hideAuth() { authEls.gate.classList.add("hidden"); }
    function authError(msg) { authEls.error.textContent = msg; authEls.error.classList.toggle("hidden", !msg); }
    function authNote(msg) { authEls.note.textContent = msg || ""; authEls.note.classList.toggle("hidden", !msg); }
    function setAuthMode(mode) {
      authMode = mode; authError(""); authNote("");
      const register = mode === "register";
      authEls.title.textContent = register ? "Create your account" : "Welcome back";
      authEls.sub.textContent = register ? "Sign up to sync your notes across devices." : "Log in to access your notes on any device.";
      authEls.submit.textContent = register ? "Create account" : "Log in";
      authEls.pw2.classList.toggle("hidden", !register);
      authEls.pw.setAttribute("autocomplete", register ? "new-password" : "current-password");
      authEls.switchText.textContent = register ? "Already have an account?" : "New to Note Buddy?";
      authEls.switchBtn.textContent = register ? "Log in" : "Create an account";
    }
    authEls.switchBtn.addEventListener("click", () => setAuthMode(authMode === "login" ? "register" : "login"));
    authEls.form.addEventListener("submit", async (e) => {
      e.preventDefault();
      authError("");
      const email = authEls.email.value.trim(), pw = authEls.pw.value;
      if (authMode === "register" && pw !== authEls.pw2.value) { authError("Passwords don't match."); return; }
      if (pw.length < 6) { authError("Password must be at least 6 characters."); return; }
      authEls.submit.disabled = true;
      authEls.submit.textContent = authMode === "register" ? "Creating…" : "Logging in…";
      try {
        if (authMode === "register") {
          const { data, error } = await sb.auth.signUp({ email, password: pw });
          if (error) throw error;
          if (!data.session) { authNote("Account created! Check your email to confirm, then log in."); setAuthMode("login"); }
          else { currentUser = data.user; await afterLogin(); }
        } else {
          const { data, error } = await sb.auth.signInWithPassword({ email, password: pw });
          if (error) throw error;
          currentUser = data.user; await afterLogin();
        }
      } catch (err) {
        authError(err?.message || "Something went wrong. Please try again.");
      } finally {
        authEls.submit.disabled = false;
        authEls.submit.textContent = authMode === "register" ? "Create account" : "Log in";
      }
    });

    async function afterLogin() {
      hideAuth();
      if (currentUser?.email) { prefs.name = prefs.name && prefs.name !== "David" ? prefs.name : currentUser.email.split("@")[0]; }
      await initialSync();
      renderProfile();
    }
    async function signOut() {
      try { await sb.auth.signOut(); } catch {}
      currentUser = null; syncReady = false;
      els.settingsModal.classList.add("hidden");
      setAuthMode("login"); showAuth();
    }

    /* ---------- Boot ---------- */
    applyTheme(); applyAccent();
    async function boot() {
      if (cloudConfigured && window.supabase?.createClient) {
        sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        setAuthMode("login");
        try {
          const { data: { session } } = await sb.auth.getSession();
          if (session?.user) { currentUser = session.user; await afterLogin(); }
          else showAuth();
        } catch (e) { console.warn(e); showAuth(); }
        sb.auth.onAuthStateChange((event) => { if (event === "SIGNED_OUT") { currentUser = null; syncReady = false; showAuth(); } });
      } else {
        // Local-only mode (no Supabase configured) — works fully offline in this browser.
        await loadAll();
      }
    }
    boot().catch((error) => { console.error(error); toast("Note Buddy could not start"); });
  </script>
</body>
</html>
