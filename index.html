<!doctype html>
<html lang="en" data-theme="light" data-accent="orange">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Note Buddy</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/css/tabulator.min.css">
  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.11/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/heic2any/0.0.4/heic2any.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ============ Design tokens ============ */
    :root {
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;

      --accent: #3b82f6;
      --accent-press: #2563eb;
      --accent-soft: rgba(59,130,246,.13);
      --accent-contrast: #ffffff;

      --bg: #f5f6f8;
      --surface: #ffffff;
      --surface-2: #f1f3f6;
      --surface-hover: #f4f6f9;
      --text: #1b1f24;
      --text-2: #545b65;
      --muted: #8b929c;
      --border: #e6e8ec;
      --border-strong: #d7dae0;
      --danger: #e5484d;

      --shadow-sm: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.05);
      --shadow-md: 0 4px 14px rgba(16,24,40,.08);
      --shadow-lg: 0 16px 40px rgba(16,24,40,.14);

      --radius: 10px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      color-scheme: light;
    }

    [data-theme="dark"] {
      --bg: #0c0e11;
      --surface: #15181d;
      --surface-2: #1b1f25;
      --surface-hover: #1f242b;
      --text: #e8eaee;
      --text-2: #a6adb6;
      --muted: #6d747d;
      --border: #262a31;
      --border-strong: #353b43;
      --danger: #f0686d;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.35);
      --shadow-md: 0 4px 16px rgba(0,0,0,.45);
      --shadow-lg: 0 18px 44px rgba(0,0,0,.55);
      color-scheme: dark;
    }

    /* accent palette */
    [data-accent="orange"] { --accent:#f97316; --accent-press:#ea580c; --accent-soft:rgba(249,115,22,.15); }
    [data-accent="blue"]   { --accent:#3b82f6; --accent-press:#2563eb; --accent-soft:rgba(59,130,246,.14); }
    [data-accent="violet"] { --accent:#7c5cff; --accent-press:#6a45f0; --accent-soft:rgba(124,92,255,.15); }
    [data-accent="green"]  { --accent:#16a34a; --accent-press:#15803d; --accent-soft:rgba(22,163,74,.15); }
    [data-accent="amber"]  { --accent:#e08600; --accent-press:#b45309; --accent-soft:rgba(224,134,0,.16); }
    [data-accent="rose"]   { --accent:#e5484d; --accent-press:#d93640; --accent-soft:rgba(229,72,77,.15); }
    [data-accent="teal"]   { --accent:#0d9488; --accent-press:#0f766e; --accent-soft:rgba(13,148,136,.15); }

    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0;
      overflow: hidden;
      color: var(--text);
      font-family: var(--font);
      font-size: 14px; font-weight: 400;
      -webkit-font-smoothing: antialiased;
      background: var(--bg);
      transition: background .25s ease, color .25s ease;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { border: 0; cursor: pointer; background: none; }
    i[data-lucide], svg[data-lucide] { width: 17px; height: 17px; stroke-width: 2; flex: 0 0 auto; }
    ::selection { background: var(--accent-soft); }

    /* ============ Shell ============ */
    .app {
      display: grid;
      grid-template-columns: 264px 384px minmax(520px, 1fr);
      width: 100vw; height: 100vh;
      overflow: hidden;
      background: var(--bg);
    }
    .sidebar, .note-list, .editor-shell { min-width: 0; min-height: 0; }

    /* ============ Sidebar ============ */
    .sidebar {
      display: flex; flex-direction: column; gap: 16px;
      padding: 20px 16px 16px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: auto;
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; min-height: 34px; padding: 0 4px; }
    .brand-word { display: inline-flex; align-items: center; gap: 8px; color: var(--text); font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
    .brand-mark { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; color: var(--accent-contrast); background: var(--accent); box-shadow: var(--shadow-sm); }
    .brand-mark svg { width: 15px; height: 15px; }
    .theme-toggle { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; color: var(--text-2); }
    .theme-toggle:hover { background: var(--surface-hover); color: var(--text); }

    .new-note-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; min-height: 40px; border-radius: var(--radius-sm);
      color: var(--accent-contrast); background: var(--accent);
      font-size: 14px; font-weight: 600; box-shadow: var(--shadow-sm);
      transition: background .15s ease, transform .12s ease;
    }
    .new-note-btn:hover { background: var(--accent-press); }
    .new-note-btn:active { transform: translateY(1px); }

    .tool-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .tool-row .icon-btn { min-height: 34px; }
    .icon-btn {
      display: inline-grid; place-items: center; gap: 0;
      min-height: 34px; padding: 0 8px; border-radius: var(--radius-sm);
      color: var(--text-2); background: var(--surface-2);
      transition: background .15s ease, color .15s ease;
    }
    .icon-btn:hover { background: var(--surface-hover); color: var(--text); }
    .icon-btn svg { width: 16px; height: 16px; }

    .section-head { display: flex; align-items: center; justify-content: space-between; min-height: 22px; margin-top: 4px; padding: 0 6px; }
    .section-label { color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; }
    .mini-add { width: 22px; height: 22px; min-height: 22px; border-radius: 6px; color: var(--muted); }
    .mini-add:hover { background: var(--surface-hover); color: var(--text); }

    .folder-list { display: flex; flex-direction: column; gap: 2px; }
    .folder-item {
      display: grid; grid-template-columns: 18px minmax(0,1fr) auto auto; align-items: center; gap: 9px;
      width: 100%; min-height: 34px; padding: 0 6px 0 10px;
      border: 1px solid transparent; border-radius: var(--radius-sm);
      color: var(--text-2); background: transparent; font-size: 13.5px; text-align: left; cursor: grab;
      transition: background .12s ease, color .12s ease;
    }
    .folder-item svg { width: 16px; height: 16px; color: var(--muted); }
    .folder-item:hover { background: var(--surface-hover); color: var(--text); }
    .folder-item.active { background: var(--accent-soft); color: var(--text); font-weight: 600; }
    .folder-item.active svg { color: var(--accent); }
    .folder-item:active { cursor: grabbing; }
    .folder-item.dragging { opacity: .45; }
    .folder-item.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
    .folder-item.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
    .folder-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .folder-actions { display: inline-flex; align-items: center; gap: 1px; opacity: 0; transition: opacity .12s ease; }
    .folder-item:hover .folder-actions { opacity: 1; }
    .folder-item:hover .count.has-actions { display: none; }
    .folder-icon-btn { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 6px; color: var(--muted); }
    .folder-icon-btn svg { width: 13px; height: 13px; }
    .folder-icon-btn:hover { color: var(--text); background: var(--surface-2); }
    .folder-delete:hover { color: var(--danger); }
    .folder-pin.is-pinned { color: var(--accent); }
    .folder-pin.is-pinned svg { color: var(--accent); }

    /* tags in sidebar */
    .tag-list { display: flex; flex-direction: column; gap: 1px; }
    .tag-row {
      display: grid; grid-template-columns: 12px minmax(0,1fr) auto auto; align-items: center; gap: 9px;
      min-height: 30px; padding: 0 6px 0 10px; border-radius: var(--radius-sm);
      color: var(--text-2); font-size: 13px; cursor: pointer;
      transition: background .12s ease;
    }
    .tag-row:hover { background: var(--surface-hover); }
    .tag-row.active { background: var(--accent-soft); color: var(--text); }
    .tag-dot { width: 9px; height: 9px; border-radius: 999px; }
    .tag-row-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .tag-row-actions { display: inline-flex; gap: 1px; opacity: 0; }
    .tag-row:hover .tag-row-actions { opacity: 1; }
    .tag-row:hover .tag-row-count { display: none; }
    .tag-row-count { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
    .tag-empty { padding: 6px 10px; color: var(--muted); font-size: 12px; }

    .filter-active-banner {
      display: none; align-items: center; gap: 8px; margin: 0 2px;
      padding: 7px 10px; border-radius: var(--radius-sm);
      background: var(--accent-soft); color: var(--text); font-size: 12px;
    }
    .filter-active-banner.show { display: flex; }
    .filter-active-banner button { margin-left: auto; color: var(--accent-press); font-weight: 600; font-size: 12px; }

    .spacer { flex: 1 1 auto; }
    .sync-chip { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 30px; margin-bottom: 8px; padding: 0 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text-2); font-size: 12px; font-weight: 600; }
    .sync-chip:hover { background: var(--surface-hover); }
    .sync-dot { width: 8px; height: 8px; border-radius: 999px; background: var(--muted); flex: 0 0 auto; }
    .sync-chip.ok .sync-dot { background: #16a34a; }
    .sync-chip.busy .sync-dot { background: var(--accent); animation: syncpulse 1s ease-in-out infinite; }
    .sync-chip.err .sync-dot { background: var(--danger); }
    .sync-chip.err { color: var(--danger); border-color: var(--danger); }
    @keyframes syncpulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
    .profile-card {
      display: grid; grid-template-columns: 32px minmax(0,1fr) 30px; align-items: center; gap: 10px;
      padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2);
    }
    .avatar { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 999px; color: var(--accent-contrast); background: var(--accent); font-size: 12px; font-weight: 650; }
    .profile-name { overflow: hidden; color: var(--text); font-size: 13px; font-weight: 600; text-overflow: ellipsis; white-space: nowrap; }
    .profile-sub { color: var(--muted); font-size: 11px; }

    /* ============ Note list ============ */
    .note-list { display: flex; flex-direction: column; gap: 14px; padding: 20px 16px 0; background: var(--bg); border-right: 1px solid var(--border); }
    .list-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 32px; }
    .list-title { display: inline-flex; align-items: center; gap: 4px; padding: 4px 8px; margin-left: -8px; border-radius: 8px; color: var(--text); font-size: 17px; font-weight: 650; letter-spacing: -.01em; cursor: pointer; }
    .list-title:hover { background: var(--surface-hover); }
    .list-title svg { width: 16px; height: 16px; color: var(--muted); }
    .list-actions { display: inline-flex; gap: 4px; }
    .ghost-btn { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; color: var(--text-2); position: relative; }
    .ghost-btn:hover { background: var(--surface-hover); color: var(--text); }
    .ghost-btn.active { color: var(--accent); background: var(--accent-soft); }
    .ghost-btn .dot-badge { position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 999px; background: var(--accent); }

    .search-wrap { position: relative; }
    .search-wrap > svg { position: absolute; top: 50%; left: 12px; width: 16px; height: 16px; color: var(--muted); transform: translateY(-50%); pointer-events: none; }
    .search-input { width: 100%; height: 38px; padding: 0 12px 0 36px; border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; background: var(--surface); color: var(--text); font-size: 13.5px; transition: border-color .15s ease, box-shadow .15s ease; }
    .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search-input::placeholder { color: var(--muted); }

    .notes-scroll { display: flex; flex: 1; flex-direction: column; gap: 8px; min-height: 0; overflow: auto; padding-bottom: 18px; }
    .note-item {
      position: relative; display: flex; flex-direction: column; gap: 7px;
      width: 100%; padding: 13px 40px 13px 14px;
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--surface); text-align: left; cursor: grab;
      transition: border-color .12s ease, box-shadow .12s ease, background .12s ease;
    }
    .note-item:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
    .note-item.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow-sm); }
    .note-item:active { cursor: grabbing; }
    .note-item.dragging { opacity: .45; }
    .note-item.drop-before { box-shadow: 0 -2px 0 var(--accent); }
    .note-item.drop-after { box-shadow: 0 2px 0 var(--accent); }
    .note-item-top { display: flex; align-items: center; gap: 7px; }
    .note-title { flex: 1; min-width: 0; overflow: hidden; color: var(--text); font-size: 14px; font-weight: 600; line-height: 1.3; text-overflow: ellipsis; white-space: nowrap; outline: 0; }
    .note-title:focus { white-space: normal; }
    .note-pin-badge { width: 13px; height: 13px; color: var(--accent); flex: 0 0 auto; }
    .note-preview { overflow: hidden; color: var(--text-2); font-size: 12.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .note-meta-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .note-time { color: var(--muted); font-size: 11.5px; }
    .note-tags { display: inline-flex; gap: 5px; flex-wrap: wrap; }
    .note-menu-trigger { position: absolute; right: 8px; top: 10px; display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; color: var(--muted); opacity: 0; transition: opacity .12s ease; }
    .note-item:hover .note-menu-trigger { opacity: 1; }
    .note-menu-trigger:hover { background: var(--surface-2); color: var(--text); }

    /* tag chips */
    .tag {
      display: inline-flex; align-items: center; gap: 5px; max-width: 140px; min-height: 19px;
      padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 550; white-space: nowrap;
    }
    .tag .x { display: inline-grid; place-items: center; width: 13px; height: 13px; border-radius: 999px; opacity: .6; margin-right: -3px; }
    .tag .x:hover { opacity: 1; background: rgba(0,0,0,.12); }
    .tag-name { overflow: hidden; text-overflow: ellipsis; }

    /* tag color palette */
    .tg-slate  { background:#eceef1; color:#4a525c; } .tg-red   { background:#fde8e8; color:#c0383e; }
    .tg-amber  { background:#fbeccb; color:#9a6206; } .tg-green { background:#dcf3e3; color:#1c7a40; }
    .tg-blue   { background:#e3edfd; color:#2563eb; } .tg-violet{ background:#ece6fe; color:#6a45f0; }
    .tg-teal   { background:#d6f1ec; color:#0f766e; } .tg-pink  { background:#fce3ef; color:#c03a78; }
    [data-theme="dark"] .tg-slate  { background:rgba(148,160,176,.18); color:#c4ccd6; }
    [data-theme="dark"] .tg-red    { background:rgba(229,72,77,.20); color:#f4a3a6; }
    [data-theme="dark"] .tg-amber  { background:rgba(224,134,0,.20); color:#f0c178; }
    [data-theme="dark"] .tg-green  { background:rgba(22,163,74,.20); color:#86dfa5; }
    [data-theme="dark"] .tg-blue   { background:rgba(59,130,246,.22); color:#9cc2fb; }
    [data-theme="dark"] .tg-violet { background:rgba(124,92,255,.24); color:#c2b1ff; }
    [data-theme="dark"] .tg-teal   { background:rgba(13,148,136,.22); color:#7fd8cd; }
    [data-theme="dark"] .tg-pink   { background:rgba(229,72,141,.20); color:#f3a6c8; }
    /* solid tag dots */
    .dot-slate{background:#94a3b8}.dot-red{background:#e5484d}.dot-amber{background:#e08600}.dot-green{background:#16a34a}
    .dot-blue{background:#3b82f6}.dot-violet{background:#7c5cff}.dot-teal{background:#0d9488}.dot-pink{background:#e5489a}

    /* ============ Editor ============ */
    .editor-shell { display: flex; flex-direction: column; background: var(--surface); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 0 22px; border-bottom: 1px solid var(--border); }
    .topbar .row { display: flex; align-items: center; gap: 8px; }
    .mobile-only { display: none; }
    .select { height: 32px; max-width: 200px; padding: 0 28px 0 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; background: var(--surface-2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b929c' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>") no-repeat right 9px center; color: var(--text); font-size: 13px; -webkit-appearance: none; appearance: none; cursor: pointer; }
    .select:focus { border-color: var(--accent); }
    .move-wrap { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .editor-actions { display: flex; align-items: center; gap: 4px; }
    .save-state-inline { color: var(--muted); font-size: 12px; white-space: nowrap; margin-right: 6px; }

    .editor { flex: 1; min-height: 0; overflow: auto; padding: 0 32px 28px; }
    #noteSurface { max-width: 720px; margin: 0 auto; padding-top: 26px; }
    .note-title-input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font-size: clamp(26px, 2.4vw, 32px); font-weight: 700; line-height: 1.15; letter-spacing: -.02em; }
    .note-title-input::placeholder { color: var(--muted); opacity: .6; }

    .note-tags-edit { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
    .add-tag-btn { display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 0 10px; border: 1px dashed var(--border-strong); border-radius: 999px; color: var(--muted); font-size: 12px; font-weight: 550; transition: all .12s ease; }
    .add-tag-btn:hover { color: var(--text); border-color: var(--text-2); }
    .add-tag-btn svg { width: 13px; height: 13px; }

    .blocks { display: flex; flex-direction: column; gap: 4px; margin-top: 22px; }
    .block { position: relative; border-radius: var(--radius-sm); padding: 2px 0; cursor: grab; }
    .block:active { cursor: grabbing; }
    .block.dragging { opacity: .5; }
    .block.drop-before { box-shadow: 0 -2px 0 var(--accent); }
    .block.drop-after { box-shadow: 0 2px 0 var(--accent); }
    .block-menu { position: absolute; top: -8px; right: -8px; left: auto; z-index: 2; opacity: 0; transition: opacity .12s ease; }
    .block:hover .block-menu, .block:focus-within .block-menu { opacity: 1; }
    .block-add-gutter { position: absolute; top: 1px; left: -32px; z-index: 2; opacity: 0; transition: opacity .12s ease; }
    .block:hover .block-add-gutter, .block:focus-within .block-add-gutter { opacity: 1; }
    .block-gutter-btn { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; color: var(--text-2); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .block-gutter-btn:hover { color: var(--accent); border-color: var(--accent); }
    .block-gutter-btn svg { width: 16px; height: 16px; }
    .block-action { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 999px; color: var(--text-2); background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .block-action svg { width: 14px; height: 14px; }
    .block-action:hover { background: var(--surface-2); color: var(--text); }
    .block-action.danger:hover { background: var(--accent-soft); color: var(--danger); border-color: var(--danger); }

    .editable { min-height: 26px; color: var(--text); outline: none; font-size: 15.5px; font-weight: 400; line-height: 1.65; overflow-wrap: anywhere; }
    .editable:empty::before { content: attr(data-placeholder); color: var(--muted); opacity: .55; }
    .editable ul { margin: 4px 0 0 20px; padding: 0; }
    .editable li { margin: 3px 0; }
    .text-block, .heading-block, .checklist-block { padding: 3px 0; }
    .heading-block .editable { min-height: 30px; font-size: 20px; font-weight: 650; line-height: 1.3; letter-spacing: -.01em; }

    .check-block { display: grid; grid-template-columns: 22px minmax(0,1fr); gap: 8px; align-items: start; }
    .check-block input { width: 17px; height: 17px; margin-top: 6px; accent-color: var(--accent); cursor: pointer; }
    .check-block.done .editable { color: var(--muted); text-decoration: line-through; }

    .audio-shell, .chart-shell, .table-shell, .image-shell {
      display: grid; gap: 12px; padding: 14px; margin: 6px 0;
      border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); cursor: grab;
    }
    .audio-head, .block-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .audio-title, .block-title { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--text); font-size: 14px; font-weight: 600; }
    .audio-title svg, .block-title svg { color: var(--accent); }
    audio { width: 100%; height: 38px; }
    .media-video { width: 100%; max-height: 360px; border-radius: var(--radius-sm); background: #000; }
    .image-empty { display: grid; place-items: center; gap: 8px; aspect-ratio: 1/1; border: 1px dashed var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--muted); text-align: center; }
    .image-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 4px; }
    .image-tile { position: relative; margin: 0; aspect-ratio: 1/1; overflow: hidden; border-radius: 10px; background: var(--surface-2); cursor: zoom-in; }
    .image-preview { display: block; width: 100%; height: 100%; object-fit: cover; }
    .image-add-tile { display: grid; place-items: center; aspect-ratio: 1/1; border: 1px dashed var(--border-strong); border-radius: 10px; background: var(--surface); color: var(--text-2); }
    .image-add-tile:hover { color: var(--accent); border-color: var(--accent); }
    .image-add-tile svg { width: 22px; height: 22px; }
    .image-remove { position: absolute; top: 5px; right: 5px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 999px; background: rgba(0,0,0,.5); color: #fff; opacity: 0; transition: opacity .12s ease; }
    .image-tile:hover .image-remove { opacity: 1; }
    .image-remove svg { width: 13px; height: 13px; }
    .file-card { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; margin: 6px 0; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); text-align: left; cursor: pointer; transition: border-color .12s ease, background .12s ease; }
    .file-card:hover { border-color: var(--border-strong); background: var(--surface-hover); }
    .file-card-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border); color: var(--accent); flex: 0 0 auto; }
    .file-card-icon svg { width: 20px; height: 20px; }
    .file-card-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
    .file-card-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); font-size: 14px; font-weight: 600; }
    .file-card-sub { color: var(--muted); font-size: 12px; letter-spacing: .02em; }
    .file-card-dl { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 8px; color: var(--text-2); flex: 0 0 auto; }
    .file-card:hover .file-card-dl { color: var(--accent); background: var(--surface); }
    .file-card-dl svg { width: 16px; height: 16px; }
    .block-files { display: grid; gap: 6px; margin-top: 8px; }
    .block-file-row, .block-file-media { display: flex; align-items: stretch; gap: 6px; }
    .block-file-row .file-card { flex: 1; margin: 0; }
    .block-file-media audio { flex: 1; align-self: center; }
    .block-file-media video { flex: 1; }
    .block-file-del { flex: 0 0 auto; display: grid; place-items: center; width: 38px; border-radius: var(--radius-sm); color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); }
    .block-file-del:hover { color: var(--danger); border-color: var(--danger); }
    .block-file-del svg { width: 14px; height: 14px; }
    .file-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .file-chip { position: relative; display: inline-flex; align-items: center; gap: 7px; max-width: 220px; min-height: 32px; padding: 0 26px 0 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); font-size: 12.5px; font-weight: 500; }
    .file-chip:hover { border-color: var(--border-strong); background: var(--surface-2); }
    .file-chip svg { width: 15px; height: 15px; color: var(--accent); }
    .file-chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-chip-x { position: absolute; right: 4px; display: grid; place-items: center; width: 20px; height: 20px; border-radius: 999px; color: var(--muted); }
    .file-chip-x:hover { color: var(--danger); background: var(--surface-hover); }
    .file-chip-x svg { width: 12px; height: 12px; color: var(--muted); }
    .rich-shell { display: grid; gap: 10px; }
    .rich-shell .image-grid { margin: 0; }
    .rich-text { min-height: 24px; }
    .rich-add-row { display: flex; justify-content: flex-end; }
    .block-caption { font-size: 13.5px; color: var(--text-2); }
    .block-caption:empty::before { font-size: 13.5px; }
    .media-caption-row { display: flex; align-items: flex-start; gap: 8px; }
    .media-caption-row .editable { flex: 1; min-width: 0; }
    .caption-photo-btn { flex: 0 0 auto; display: grid; place-items: center; width: 30px; height: 30px; border-radius: var(--radius-sm); color: var(--text-2); background: var(--surface); border: 1px solid var(--border); }
    .caption-photo-btn:hover { color: var(--text); border-color: var(--accent); background: var(--surface-2); }
    .caption-photo-btn svg { width: 15px; height: 15px; }
    /* Lightbox */
    .lightbox { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: rgba(8,10,14,.92); }
    .lb-img { max-width: 92vw; max-height: 88vh; border-radius: 8px; object-fit: contain; box-shadow: 0 20px 60px rgba(0,0,0,.5); user-select: none; }
    .lb-close { position: fixed; top: 20px; right: 22px; display: grid; place-items: center; width: 42px; height: 42px; border-radius: 999px; color: #fff; background: rgba(255,255,255,.12); }
    .lb-close:hover { background: rgba(255,255,255,.22); }
    .lb-nav { position: fixed; top: 50%; display: grid; place-items: center; width: 48px; height: 48px; border-radius: 999px; color: #fff; background: rgba(255,255,255,.12); transform: translateY(-50%); }
    .lb-nav:hover { background: rgba(255,255,255,.22); }
    .lb-prev { left: 22px; } .lb-next { right: 22px; }
    .lb-nav svg, .lb-close svg { width: 22px; height: 22px; }
    .lb-counter { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); padding: 5px 12px; border-radius: 999px; background: rgba(255,255,255,.12); color: #fff; font-size: 13px; font-variant-numeric: tabular-nums; }
    .lb-nav.hidden, .lb-counter.hidden { display: none; }

    .insert-bar { position: sticky; bottom: 0; z-index: 3; display: flex; align-items: center; gap: 6px; margin-top: 24px; padding: 8px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-md); overflow-x: auto; }
    .tool-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 11px; border-radius: var(--radius-sm); color: var(--text-2); background: transparent; font-size: 12.5px; font-weight: 600; white-space: nowrap; transition: background .12s ease, color .12s ease; }
    .tool-btn svg { width: 15px; height: 15px; }
    .tool-btn:hover { background: var(--surface-2); color: var(--text); }
    .recorder { display: flex; align-items: center; gap: 6px; min-width: max-content; margin-left: auto; padding-left: 8px; border-left: 1px solid var(--border); }
    .record-btn { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 0 12px; border-radius: var(--radius-sm); color: var(--accent-contrast); background: var(--accent); font-size: 12.5px; font-weight: 600; }
    .record-btn:hover { background: var(--accent-press); }
    .recorder.is-recording .record-btn { background: var(--danger); }
    .rec-wave { display: none; width: 148px; height: 30px; }
    .recorder.is-recording .rec-wave { display: block; }
    .record-mode { height: 32px; }

    .chart-controls { display: flex; gap: 8px; }
    .chart-config { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .chart-config textarea { min-height: 64px; padding: 9px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text); resize: vertical; outline: none; }
    .chart-config textarea:focus { border-color: var(--accent); }
    .chart-canvas-wrap { height: 180px; }
    .table-controls { display: flex; gap: 8px; }
    .mini-pill { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; padding: 0 11px; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-2); background: var(--surface); font-size: 12px; font-weight: 600; }
    .mini-pill:hover { color: var(--text); border-color: var(--border-strong); }
    .mini-pill svg { width: 14px; height: 14px; }

    .empty-state { display: grid; place-items: center; gap: 10px; min-height: 60vh; color: var(--muted); text-align: center; }
    .empty-state .empty-icon { display: grid; place-items: center; width: 54px; height: 54px; border-radius: 16px; background: var(--surface-2); color: var(--muted); }
    .empty-state .empty-icon svg { width: 24px; height: 24px; }
    .hidden { display: none !important; }

    /* Tabulator theming */
    .tabulator { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; background: var(--surface); font-family: var(--font); }
    .tabulator, .tabulator-row, .tabulator .tabulator-header, .tabulator-row .tabulator-cell { color: var(--text); }
    .tabulator .tabulator-header { border-bottom: 1px solid var(--border); background: var(--surface-2); font-weight: 600; }
    .tabulator .tabulator-header .tabulator-col { background: transparent; border-right: 1px solid var(--border); }
    .tabulator .tabulator-tableholder, .tabulator .tabulator-tableholder .tabulator-table { background: var(--surface); }
    .tabulator-row { border-bottom: 1px solid var(--border); background: var(--surface); }
    .tabulator-row.tabulator-row-even { background: var(--surface-2); }
    .tabulator-row .tabulator-cell { padding: 8px 10px; border-right: 1px solid var(--border); }
    .tabulator-row .tabulator-cell.tabulator-editing { border-color: var(--accent); }
    .progress-cell { display: grid; grid-template-columns: minmax(40px,1fr) 34px; align-items: center; gap: 8px; color: var(--text-2); }
    .progress-track { display: block; height: 6px; overflow: hidden; border-radius: 999px; background: var(--surface-hover); }
    .progress-fill { display: block; height: 100%; border-radius: inherit; background: var(--accent); }

    /* ============ Overlays ============ */
    .toast { position: fixed; left: 50%; bottom: 24px; z-index: 90; transform: translate(-50%, 16px); opacity: 0; max-width: min(360px, calc(100vw - 32px)); padding: 11px 16px; border-radius: var(--radius); background: var(--text); color: var(--bg); font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); transition: transform .2s ease, opacity .2s ease; pointer-events: none; }
    .toast.show { transform: translate(-50%, 0); opacity: 1; }

    .popover { position: fixed; z-index: 70; min-width: 180px; padding: 5px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow-lg); }
    .menu-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 34px; padding: 0 10px; border-radius: var(--radius-sm); color: var(--text); font-size: 13px; font-weight: 500; text-align: left; }
    .menu-item svg { width: 15px; height: 15px; color: var(--text-2); }
    .menu-item:hover { background: var(--surface-hover); }
    .menu-item.danger { color: var(--danger); } .menu-item.danger svg { color: var(--danger); }
    .menu-item.checked svg { color: var(--accent); }
    .menu-heading { padding: 7px 10px 5px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; }
    .menu-sep { height: 1px; margin: 4px 6px; background: var(--border); }

    /* filter popover */
    .filter-pop { min-width: 248px; padding: 12px; }
    .filter-group { margin-bottom: 12px; }
    .filter-group:last-child { margin-bottom: 0; }
    .filter-group-label { display: block; margin-bottom: 7px; color: var(--muted); font-size: 11px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; }
    .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .seg button { min-height: 30px; padding: 0 8px; border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text-2); font-size: 12px; font-weight: 600; }
    .seg button.active { background: var(--accent); color: var(--accent-contrast); }
    .chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
    .filter-chip { display: inline-flex; align-items: center; gap: 5px; min-height: 26px; padding: 0 10px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-2); background: var(--surface); font-size: 12px; font-weight: 550; }
    .filter-chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
    .filter-chip .tag-dot { width: 8px; height: 8px; }
    .filter-clear { width: 100%; min-height: 34px; margin-top: 4px; border-radius: var(--radius-sm); background: var(--surface-2); color: var(--text); font-size: 13px; font-weight: 600; }
    .filter-clear:hover { background: var(--surface-hover); }

    /* auth gate */
    .auth-gate { position: fixed; inset: 0; z-index: 120; display: grid; place-items: center; padding: 24px; background: var(--bg); }
    .auth-card { width: min(400px, 100%); padding: 30px 28px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-lg); }
    .auth-brand { display: inline-flex; align-items: center; gap: 9px; margin-bottom: 22px; color: var(--text); font-size: 18px; font-weight: 650; }
    .auth-brand .brand-mark { width: 28px; height: 28px; }
    .auth-title { margin: 0 0 4px; color: var(--text); font-size: 21px; font-weight: 700; letter-spacing: -.01em; }
    .auth-sub { margin: 0 0 20px; color: var(--text-2); font-size: 13.5px; }
    .auth-field { width: 100%; min-height: 44px; margin-bottom: 11px; padding: 0 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; background: var(--surface-2); color: var(--text); font-size: 14.5px; }
    .auth-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .auth-submit { width: 100%; min-height: 44px; margin-top: 4px; border-radius: var(--radius-sm); color: var(--accent-contrast); background: var(--accent); font-size: 14.5px; font-weight: 650; }
    .auth-submit:hover { background: var(--accent-press); }
    .auth-submit:disabled { opacity: .6; cursor: default; }
    .auth-error { margin-bottom: 11px; padding: 9px 12px; border-radius: var(--radius-sm); background: rgba(229,72,77,.12); color: var(--danger); font-size: 12.5px; }
    .auth-note { margin-bottom: 11px; padding: 9px 12px; border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--text); font-size: 12.5px; }
    .auth-switch { margin-top: 18px; color: var(--text-2); font-size: 13px; text-align: center; }
    .auth-switch button { color: var(--accent-press); font-weight: 650; }
    .auth-local { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); text-align: center; }
    .auth-local button { color: var(--text-2); font-size: 12.5px; font-weight: 600; }
    .auth-local button:hover { color: var(--text); }
    .settings-account { display: grid; gap: 8px; }
    .settings-email { color: var(--text-2); font-size: 13px; }
    .signout-btn { min-height: 40px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--danger); font-size: 13.5px; font-weight: 600; }
    .signout-btn:hover { background: rgba(229,72,77,.08); border-color: var(--danger); }

    /* modal */
    .modal-backdrop { position: fixed; inset: 0; z-index: 80; display: grid; place-items: center; padding: 20px; background: rgba(8,10,14,.4); backdrop-filter: blur(3px); }
    .app-modal { width: min(460px, 100%); max-height: 88vh; overflow: auto; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-lg); }
    .modal-body { display: grid; gap: 16px; padding: 22px; }
    .modal-title { margin: 0; color: var(--text); font-size: 18px; font-weight: 650; }
    .modal-copy { margin: 0; color: var(--text-2); font-size: 13px; line-height: 1.5; }
    .modal-field { width: 100%; min-height: 42px; padding: 0 13px; border: 1px solid var(--border); border-radius: var(--radius-sm); outline: none; background: var(--surface-2); color: var(--text); font-size: 14.5px; }
    .modal-field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; padding: 0 22px 22px; }
    .modal-btn { min-height: 40px; padding: 0 16px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-weight: 600; }
    .modal-btn:hover { background: var(--surface-hover); }
    .modal-btn.primary { border: 0; color: var(--accent-contrast); background: var(--accent); }
    .modal-btn.primary:hover { background: var(--accent-press); }

    .field-label { display: block; margin-bottom: 7px; color: var(--text); font-size: 13px; font-weight: 600; }
    .field-sub { margin-top: 5px; color: var(--muted); font-size: 11.5px; }
    .settings-section { display: grid; gap: 8px; }
    .theme-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .theme-seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 38px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-2); font-size: 13px; font-weight: 600; }
    .theme-seg button.active { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
    .theme-seg button svg { width: 15px; height: 15px; }
    .swatch-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .swatch { width: 30px; height: 30px; border-radius: 999px; border: 2px solid transparent; cursor: pointer; position: relative; }
    .swatch.active { border-color: var(--text); }
    .swatch.active::after { content: ""; position: absolute; inset: 0; margin: auto; width: 8px; height: 8px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.2); }

    .tag-manage-list { display: grid; gap: 6px; max-height: 220px; overflow: auto; }
    .tag-manage-row { display: grid; grid-template-columns: minmax(0,1fr) auto auto; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); }
    .tag-manage-colors { display: inline-flex; gap: 4px; }
    .tag-color-dot { width: 16px; height: 16px; border-radius: 999px; border: 2px solid transparent; cursor: pointer; }
    .tag-color-dot.active { border-color: var(--text); }
    .tag-manage-del { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 6px; color: var(--muted); }
    .tag-manage-del:hover { color: var(--danger); background: var(--surface-hover); }

    .drawer-backdrop { display: none; }

    /* ============ Responsive ============ */
    @media (max-width: 1080px) and (min-width: 721px) {
      .app { grid-template-columns: 240px minmax(0,1fr); }
      .note-list { display: none; }
      .note-list.mobile-open { position: fixed; inset: 0 0 0 240px; z-index: 20; display: flex; box-shadow: var(--shadow-lg); }
      .mobile-only { display: inline-grid; }
    }

    /* ============ Phone ============ */
    @media (max-width: 720px) {
      html, body { height: 100%; overflow: hidden; }
      .app { position: relative; height: 100vh; height: 100dvh; grid-template-columns: 1fr; overflow: hidden; }
      .mobile-only { display: inline-grid !important; }

      /* Sidebar becomes a left drawer */
      .sidebar { position: fixed; top: 0; left: 0; bottom: 0; z-index: 45; width: 84%; max-width: 330px; transform: translateX(-100%); transition: transform .25s ease; border-right: 1px solid var(--border); }
      .app.drawer-open .sidebar { transform: none; box-shadow: var(--shadow-lg); }
      .drawer-backdrop { display: block; position: fixed; inset: 0; z-index: 44; background: rgba(8,10,14,.45); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
      .app.drawer-open .drawer-backdrop { opacity: 1; pointer-events: auto; }
      .folder-list { flex-direction: column; }
      .folder-item, .tag-row { min-height: 40px; }
      .folder-actions, .tag-row-actions { opacity: 1; }

      /* Notes list = base screen */
      .note-list { position: fixed; inset: 0; z-index: 10; display: flex; gap: 0; padding: 0; border-right: 0; background: var(--bg); }
      .list-head { position: sticky; top: 0; z-index: 2; gap: 6px; min-height: 56px; padding: 10px 12px; background: var(--bg); border-bottom: 1px solid var(--border); }
      .list-title { font-size: 17px; }
      .search-wrap { padding: 10px 12px 0; }
      .notes-scroll { padding: 12px 12px 28px; gap: 8px; }
      .note-item { padding: 14px 44px 14px 14px; }
      .note-menu-trigger { opacity: 1; }

      /* Editor slides over from the right */
      .editor-shell { position: fixed; inset: 0; z-index: 20; transform: translateX(100%); transition: transform .25s ease; }
      .app.show-editor .editor-shell { transform: none; }
      .topbar { position: sticky; top: 0; z-index: 2; min-height: 56px; padding: 8px 10px; background: var(--surface); }
      .move-wrap { display: none; }
      .editor { padding: 0 16px 90px; }
      #noteSurface { padding-top: 14px; }
      .note-title-input { font-size: 26px; }

      /* Block controls always visible (no hover on touch) */
      .block-menu { opacity: 1; top: -6px; right: -4px; }
      .block-add-gutter { position: static; opacity: 1; margin-bottom: 6px; }
      .block { padding-left: 0; }

      /* Insert bar: icon-only, horizontal scroll, pinned */
      .insert-bar { position: sticky; bottom: 0; flex-wrap: nowrap; gap: 4px; padding: 8px 10px; overflow-x: auto; }
      .insert-bar .tool-btn span, .record-btn span { display: none; }
      .insert-bar .tool-btn { min-width: 42px; min-height: 42px; padding: 0; justify-content: center; }
      .record-btn { min-width: 44px; min-height: 42px; padding: 0 12px; }
      .recorder { margin-left: auto; padding-left: 6px; border-left: 1px solid var(--border); border-top: 0; }
      .rec-wave { width: 84px; }
      .chart-config { grid-template-columns: 1fr; }

      .toast { bottom: 84px; }
      .popover { max-width: calc(100vw - 24px); }
    }
  </style>
</head>
<body>

  <div class="auth-gate hidden" id="authGate">
    <div class="auth-card">

        <input class="auth-field" type="password" id="authPassword" placeholder="Password" autocomplete="current-password" required minlength="6">
        <input class="auth-field hidden" type="password" id="authPassword2" placeholder="Repeat password" autocomplete="new-password" minlength="6">
        <button class="auth-submit" type="submit" id="authSubmit">Log in</button>

    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ============================================================
       SUPABASE CONFIG — paste your project URL + anon key here.
       Until you do, Note Buddy runs in local-only mode (no login).
       Get these from Supabase → Project Settings → API.
       ============================================================ */
    const SUPABASE_URL = "https://rybfbelahsxjttjxdvih.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_z2RdoPXLmqYyjcM8l1uiMQ_qnBy1qC8";

    const cloudConfigured = SUPABASE_URL.startsWith("http") && !/YOUR-PROJECT/.test(SUPABASE_URL) && !/YOUR-ANON-KEY/.test(SUPABASE_ANON_KEY);
    let sb = null;            // supabase client
    let currentUser = null;   // logged-in user
    let syncReady = false;    // true once initial pull/seed done
    let syncTimer = null;
    const cloudReady = () => !!(sb && currentUser);

    const db = new Dexie("NoteBuddyV1");
    db.version(1).stores({
      folders: "id, name, updatedAt",
      notes: "id, folderId, title, updatedAt, createdAt",
      attachments: "id, noteId, blockId, type, createdAt"
    });
    db.version(2).stores({
      folders: "id, name, updatedAt",
      notes: "id, folderId, title, updatedAt, createdAt",
      attachments: "id, noteId, blockId, type, createdAt",
      tags: "id, name, createdAt"
    }).upgrade((tx) => tx.table("notes").toCollection().modify((note) => {
      if (!Array.isArray(note.tags)) note.tags = [];
    }));

    const $ = (selector, root = document) => root.querySelector(selector);
    const $$ = (selector, root = document) => Array.from(root.querySelectorAll(selector));
    const uid = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
    const now = () => new Date().toISOString();
    const escapeHtml = (value = "") => value.replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));

    const TAG_COLORS = ["slate", "red", "amber", "green", "blue", "violet", "teal", "pink"];

    const prefs = {
      get theme() { return localStorage.getItem("nb_theme") || "system"; },
      set theme(v) { localStorage.setItem("nb_theme", v); },
      get accent() { return localStorage.getItem("nb_accent") || "orange"; },
      set accent(v) { localStorage.setItem("nb_accent", v); },
      get name() { return localStorage.getItem("nb_name") || "David"; },
      set name(v) { localStorage.setItem("nb_name", v); },
      get sort() { return localStorage.getItem("nb_sort") || "updated"; },
      set sort(v) { localStorage.setItem("nb_sort", v); }
    };

    const state = {
      folders: [], notes: [], tags: [],
      selectedFolderId: "all",
      selectedNoteId: null,
      selectedNote: null,
      search: "",
      filterTagIds: new Set(),
      filterTypes: new Set(),
      sortMode: prefs.sort,
      dragCandidate: null,
      suppressNextClick: false,
      folderPointerDrag: null,
      notePointerDrag: null,
      blockPointerDrag: null,
      noteTitleTimers: new Map(),
      saveTimer: null,
      recording: null,
      chartInstances: new Map(),
      tableInstances: new Map()
    };

    const els = {
      folderList: $("#folderList"), tagList: $("#tagList"), notesList: $("#notesList"),
      currentFolderName: $("#currentFolderName"), searchInput: $("#searchInput"),
      emptyState: $("#emptyState"), noteSurface: $("#noteSurface"), titleInput: $("#titleInput"),
      noteTagsEdit: $("#noteTagsEdit"), blocks: $("#blocks"), moveFolderSelect: $("#moveFolderSelect"),
      saveState: $("#saveState"), recorder: $("#recorder"), recordBtn: $("#recordBtn"),
      imageInput: $("#imageInput"), mediaInput: $("#mediaInput"), attachInput: $("#attachInput"), importInput: $("#importInput"), popover: $("#popover"),
      inputModal: $("#inputModal"), inputModalForm: $("#inputModalForm"), inputModalTitle: $("#inputModalTitle"),
      inputModalCopy: $("#inputModalCopy"), inputModalField: $("#inputModalField"), inputModalCancel: $("#inputModalCancel"),
      toast: $("#toast"), noteListPane: $("#noteListPane"), filterBtn: $("#filterBtn"),
      filterBanner: $("#filterBanner"), filterBannerText: $("#filterBannerText"),
      settingsModal: $("#settingsModal"), profileName: $("#profileName"), profileAvatar: $("#profileAvatar"),
      pinBtn: $("#pinBtn"), themeToggle: $("#themeToggle")
    };

    /* ============ Theme ============ */
    const mql = window.matchMedia("(prefers-color-scheme: dark)");
    function applyTheme() {
      const theme = prefs.theme;
      const dark = theme === "dark" || (theme === "system" && mql.matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      const icon = els.themeToggle.querySelector("[data-lucide]");
      if (icon) { icon.setAttribute("data-lucide", dark ? "sun" : "moon"); iconRefresh(); }
    }
    function applyAccent() { document.documentElement.dataset.accent = prefs.accent; }
    mql.addEventListener("change", () => { if (prefs.theme === "system") applyTheme(); });

    function iconRefresh() { if (window.lucide) lucide.createIcons(); }

    function toast(message) {
      els.toast.textContent = message;
      els.toast.classList.add("show");
      clearTimeout(els.toast._timer);
      els.toast._timer = setTimeout(() => els.toast.classList.remove("show"), 2400);
    }

    function askForText({ title, copy = "", value = "", placeholder = "" }) {
      closePopover();
      els.inputModalTitle.textContent = title;
      els.inputModalCopy.textContent = copy;
      els.inputModalCopy.classList.toggle("hidden", !copy);
      els.inputModalField.value = value;
      els.inputModalField.placeholder = placeholder;
      els.inputModal.classList.remove("hidden");
      requestAnimationFrame(() => { els.inputModalField.focus(); els.inputModalField.select(); });
      return new Promise((resolve) => {
        const cleanup = (result) => {
          els.inputModal.classList.add("hidden");
          els.inputModalForm.removeEventListener("submit", onSubmit);
          els.inputModalCancel.removeEventListener("click", onCancel);
          els.inputModal.removeEventListener("click", onBackdrop);
          document.removeEventListener("keydown", onKeydown);
          resolve(result);
        };
        const onSubmit = (e) => { e.preventDefault(); cleanup(els.inputModalField.value.trim()); };
        const onCancel = () => cleanup(null);
        const onBackdrop = (e) => { if (e.target === els.inputModal) cleanup(null); };
        const onKeydown = (e) => { if (e.key === "Escape") cleanup(null); };
        els.inputModalForm.addEventListener("submit", onSubmit);
        els.inputModalCancel.addEventListener("click", onCancel);
        els.inputModal.addEventListener("click", onBackdrop);
        document.addEventListener("keydown", onKeydown);
      });
    }

    function setSaveState(text) {
      if (text === "Saving...") { els.saveState.textContent = "Saving…"; return; }
      const stamp = state.selectedNote?.updatedAt || now();
      els.saveState.textContent = `Edited ${formatTime(stamp)}`;
    }

    function formatTime(iso) {
      const date = new Date(iso);
      const today = new Date();
      const sameDay = date.toDateString() === today.toDateString();
      if (sameDay) return new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" }).format(date);
      return new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric" }).format(date);
    }

    function stripTags(value) { const div = document.createElement("div"); div.innerHTML = value || ""; return div.textContent || div.innerText || ""; }

    function firstText(note) {
      if (!note) return "";
      for (const b of (note.blocks || [])) {
        if (!b.data) continue;
        const direct = b.data.text || b.data.caption || b.data.title;
        if (direct && String(direct).trim()) return stripTags(direct);
        if (Array.isArray(b.data.items)) { for (const it of b.data.items) if (it.kind === "text" && stripTags(it.text || "").trim()) return stripTags(it.text); }
      }
      return "No additional text";
    }

    function noteContentTypes(note) {
      const types = new Set();
      for (const block of note.blocks || []) {
        if (["paragraph", "heading"].includes(block.type)) types.add("text");
        if (block.type === "checklist") types.add("checklist");
        if (block.type === "image") types.add("image");
        if (block.type === "audio" || block.type === "session" || block.type === "video") types.add("audio");
        if (block.type === "table") types.add("table");
        if (block.type === "chart") types.add("chart");
        if (Array.isArray(block.data.images) && block.data.images.length) types.add("image");
        for (const it of (block.data.items || [])) { if (it.kind === "audio" || it.kind === "video") types.add("audio"); if (it.kind === "text" && stripTags(it.text || "").trim()) types.add("text"); }
      }
      return types;
    }

    /* ============ Tags ============ */
    function tagById(id) { return state.tags.find((t) => t.id === id); }
    function noteTagObjects(note) { return (note.tags || []).map(tagById).filter(Boolean); }

    function tagChipHtml(tag, removable = false, blockData) {
      return `<span class="tag tg-${tag.color}" data-tag-chip="${tag.id}">
        <span class="tag-name">${escapeHtml(tag.name)}</span>
        ${removable ? `<span class="x" data-remove-tag="${tag.id}" aria-label="Remove tag"><i data-lucide="x"></i></span>` : ""}
      </span>`;
    }

    async function createTag(presetName) {
      const name = presetName || await askForText({ title: "New tag", copy: "Name your tag.", value: "", placeholder: "Tag name" });
      if (!name) return null;
      const trimmed = name.trim();
      if (!trimmed) return null;
      if (state.tags.some((t) => t.name.toLowerCase() === trimmed.toLowerCase())) { toast("Tag already exists"); return null; }
      const color = TAG_COLORS[state.tags.length % TAG_COLORS.length];
      const tag = { id: uid(), name: trimmed, color, createdAt: now() };
      await db.tags.add(tag);
      state.tags.push(tag);
      scheduleSync();
      return tag;
    }

    async function renameTag(tagId) {
      const tag = tagById(tagId);
      if (!tag) return;
      const name = await askForText({ title: "Rename tag", value: tag.name, placeholder: "Tag name" });
      if (!name) return;
      tag.name = name.trim();
      await db.tags.put(tag);
      await reloadAndRender();
    }

    async function setTagColor(tagId, color) {
      const tag = tagById(tagId);
      if (!tag) return;
      tag.color = color;
      await db.tags.put(tag);
      await reloadAndRender();
    }

    async function deleteTag(tagId) {
      await db.tags.delete(tagId);
      state.filterTagIds.delete(tagId);
      await db.notes.toCollection().modify((note) => {
        if (Array.isArray(note.tags) && note.tags.includes(tagId)) note.tags = note.tags.filter((id) => id !== tagId);
      });
      await reloadAndRender();
      toast("Tag deleted");
    }

    async function toggleNoteTag(noteId, tagId) {
      const note = state.notes.find((n) => n.id === noteId);
      if (!note) return;
      if (!Array.isArray(note.tags)) note.tags = [];
      if (note.tags.includes(tagId)) note.tags = note.tags.filter((id) => id !== tagId);
      else note.tags.push(tagId);
      note.updatedAt = now();
      await db.notes.put(note);
      if (state.selectedNote?.id === noteId) state.selectedNote.tags = note.tags;
      renderTags(); renderNotes(); renderNoteTagsEdit();
      scheduleSync();
    }

    function toggleTagFilter(tagId) {
      if (state.filterTagIds.has(tagId)) state.filterTagIds.delete(tagId);
      else state.filterTagIds.add(tagId);
      renderTags(); renderNotes(); renderFilterState();
    }

    /* ============ Filtering & sorting ============ */
    function noteMatchesSearch(note) {
      if (!state.search) return true;
      const haystack = [note.title, ...(note.blocks || []).map((b) => JSON.stringify(b.data || {})), ...noteTagObjects(note).map((t) => t.name)].join(" ").toLowerCase();
      return haystack.includes(state.search.toLowerCase());
    }
    function noteMatchesTagFilter(note) {
      if (!state.filterTagIds.size) return true;
      return [...state.filterTagIds].every((id) => (note.tags || []).includes(id));
    }
    function noteMatchesTypeFilter(note) {
      if (!state.filterTypes.size) return true;
      const types = noteContentTypes(note);
      return [...state.filterTypes].every((t) => types.has(t));
    }

    function visibleNotes() {
      return state.notes
        .filter((note) => state.selectedFolderId === "all" || note.folderId === state.selectedFolderId)
        .filter(noteMatchesSearch).filter(noteMatchesTagFilter).filter(noteMatchesTypeFilter)
        .sort(compareNotes);
    }

    function compareNotes(a, b) {
      if (!!a.pinnedAt !== !!b.pinnedAt) return a.pinnedAt ? -1 : 1;
      if (state.sortMode === "title") return (a.title || "").localeCompare(b.title || "");
      if (state.sortMode === "created") return new Date(b.createdAt) - new Date(a.createdAt);
      if (state.sortMode === "manual") {
        const ao = Number.isFinite(a.sortOrder) ? a.sortOrder : Number.MAX_SAFE_INTEGER;
        const bo = Number.isFinite(b.sortOrder) ? b.sortOrder : Number.MAX_SAFE_INTEGER;
        if (ao !== bo) return ao - bo;
      }
      return new Date(b.updatedAt) - new Date(a.updatedAt);
    }

    async function ensureNoteSortOrder() {
      const missing = state.notes.filter((note) => !Number.isFinite(note.sortOrder));
      if (!missing.length) return;
      const ordered = [...state.notes].sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
      await Promise.all(ordered.map((note, index) => db.notes.update(note.id, { sortOrder: index })));
      state.notes = await db.notes.orderBy("updatedAt").reverse().toArray();
    }

    function defaultFolderId() { return state.folders.find((f) => f.name === "Work")?.id || state.folders[0]?.id; }
    function naturalFolderOrder(name) { const i = ["Work", "Personal", "Ideas", "Archive"].indexOf(name); return i === -1 ? 99 : i; }
    function sortFolders(folders = state.folders) {
      return [...folders].sort((a, b) => {
        if (!!a.pinnedAt !== !!b.pinnedAt) return a.pinnedAt ? -1 : 1;
        const ao = Number.isFinite(a.sortOrder) ? a.sortOrder : naturalFolderOrder(a.name);
        const bo = Number.isFinite(b.sortOrder) ? b.sortOrder : naturalFolderOrder(b.name);
        if (ao !== bo) return ao - bo;
        return a.name.localeCompare(b.name);
      });
    }
    async function ensureFolderSortOrder() {
      const missing = state.folders.filter((f) => !Number.isFinite(f.sortOrder));
      if (!missing.length) return;
      const ordered = sortFolders(state.folders);
      await Promise.all(ordered.map((f, i) => db.folders.update(f.id, { sortOrder: i })));
      state.folders = await db.folders.orderBy("updatedAt").reverse().toArray();
    }

    /* ============ Seed data ============ */
    function starterNote(title, text, folderId, minutesAgo, tags = []) {
      const stamp = new Date(Date.now() - minutesAgo * 60000).toISOString();
      return { id: uid(), folderId, title, tags, blocks: [{ id: uid(), type: "paragraph", data: { text } }], createdAt: stamp, updatedAt: stamp };
    }

    async function reloadAndRender() {
      state.folders = await db.folders.orderBy("updatedAt").reverse().toArray();
      state.notes = await db.notes.orderBy("updatedAt").reverse().toArray();
      state.tags = await db.tags.orderBy("createdAt").toArray();
      state.selectedNote = state.notes.find((n) => n.id === state.selectedNoteId) || null;
      renderAll();
      scheduleSync();
    }

    async function loadAll() {
      state.folders = await db.folders.orderBy("updatedAt").reverse().toArray();
      state.notes = await db.notes.orderBy("updatedAt").reverse().toArray();
      state.tags = await db.tags.orderBy("createdAt").toArray();

      if (!state.folders.length) {
        for (const [sortOrder, name] of ["Work", "Personal", "Ideas", "Archive"].entries())
          await db.folders.add({ id: uid(), name, sortOrder, createdAt: now(), updatedAt: now() });
      } else if (!state.folders.some((f) => f.name === "Archive")) {
        await db.folders.add({ id: uid(), name: "Archive", sortOrder: state.folders.length, createdAt: now(), updatedAt: now() });
      }
      state.folders = await db.folders.orderBy("updatedAt").reverse().toArray();
      await ensureFolderSortOrder();
      await ensureNoteSortOrder();

      if (!state.tags.length) {
        const seedTags = [
          { id: uid(), name: "Urgent", color: "red", createdAt: now() },
          { id: uid(), name: "Idea", color: "blue", createdAt: now() },
          { id: uid(), name: "Meeting", color: "amber", createdAt: now() },
          { id: uid(), name: "Project Phoenix", color: "green", createdAt: now() }
        ];
        await db.tags.bulkAdd(seedTags);
        state.tags = await db.tags.orderBy("createdAt").toArray();
      }

      if (!state.notes.length) {
        const workId = defaultFolderId();
        const t = Object.fromEntries(state.tags.map((tag) => [tag.name, tag.id]));
        await createProjectPhoenixNote(workId, false, [t["Meeting"], t["Project Phoenix"]].filter(Boolean));
        await db.notes.bulkAdd([
          starterNote("Ideas for New Features", "Quick capture of potential features for Note Buddy.", workId, 12, [t["Idea"]].filter(Boolean)),
          starterNote("Weekly Planning", "Plan for the week and prioritize tasks.", workId, 24, [t["Urgent"]].filter(Boolean)),
          starterNote("Client Feedback Summary", "Key points from the client feedback call.", workId, 36, [t["Meeting"]].filter(Boolean)),
          starterNote("Shopping List", "Groceries and household items.", workId, 48, [])
        ]);
        state.notes = await db.notes.orderBy("updatedAt").reverse().toArray();
      }

      await migrateImageBlocksToItems();
      state.selectedNoteId = state.selectedNoteId || state.notes[0]?.id || null;
      state.selectedNote = state.notes.find((n) => n.id === state.selectedNoteId) || null;
      renderAll();
      scheduleSync();
    }

    // Reorganize legacy image blocks ({images, caption, files}) into the ordered items model (same content, same order).
    async function migrateImageBlocksToItems() {
      let changed = false;
      for (const note of state.notes) {
        let touched = false;
        for (const b of (note.blocks || [])) { if (b.type === "image" && !Array.isArray(b.data.items)) { ensureItems(b); touched = true; } }
        if (touched) { await db.notes.put(note); changed = true; }
      }
      if (changed) state.notes = await db.notes.orderBy("updatedAt").reverse().toArray();
    }

    // Convert any legacy in-caption file chips (block.data.files) into standalone file blocks.
    async function migrateLegacyFiles() {
      let changed = false;
      for (const note of state.notes) {
        if (!(note.blocks || []).some((b) => Array.isArray(b.data.files) && b.data.files.length)) continue;
        const next = [];
        for (const b of note.blocks) {
          const files = Array.isArray(b.data.files) ? b.data.files : [];
          delete b.data.files;
          next.push(b);
          for (const f of files) next.push({ id: uid(), type: "file", data: { createdAt: now(), attachmentId: f.attachmentId, name: f.name, mimeType: f.mimeType || "", size: f.size || 0 } });
        }
        note.blocks = next;
        await db.notes.put(note);
        changed = true;
      }
      if (changed) state.notes = await db.notes.orderBy("updatedAt").reverse().toArray();
    }

    /* ============ Rendering ============ */
    function renderAll() { renderFolders(); renderTags(); renderNotes(); renderFolderSelect(); renderEditor(); renderFilterState(); renderProfile(); iconRefresh(); }

    }

    function renderFolders() {
      const counts = state.notes.reduce((acc, note) => { acc[note.folderId] = (acc[note.folderId] || 0) + 1; return acc; }, {});

    function renderTags() {
      if (!state.tags.length) { els.tagList.innerHTML = `<div class="tag-empty">No tags yet. Create one with +</div>`; return; }
      const counts = state.notes.reduce((acc, note) => { (note.tags || []).forEach((id) => acc[id] = (acc[id] || 0) + 1); return acc; }, {});
      els.tagList.innerHTML = state.tags.map((tag) => {
        const active = state.filterTagIds.has(tag.id) ? " active" : "";

          </span>
        </div>`;
      }).join("");
    }

    function renderNotes() {
      const folderName = state.selectedFolderId === "all" ? "All Notes" : (state.folders.find((f) => f.id === state.selectedFolderId)?.name || "Notes");
      els.currentFolderName.textContent = folderName;
      const notes = visibleNotes();
      if (!notes.length) {
        const filtered = state.search || state.filterTagIds.size || state.filterTypes.size;
        els.notesList.innerHTML = `<div class="tag-empty" style="text-align:center;padding:32px 12px;">${filtered ? "No notes match your filters." : "No notes here yet."}</div>`;
        return;
      }
      els.notesList.innerHTML = notes.map((note) => {
        const tags = noteTagObjects(note).slice(0, 3);

          <div class="note-item-top">
            <span class="note-title" contenteditable="true" data-note-title="${note.id}" spellcheck="false">${escapeHtml(note.title || "Untitled")}</span>
            ${note.pinnedAt ? `<i class="note-pin-badge" data-lucide="pin"></i>` : ""}
          </div>
          <span class="note-preview">${escapeHtml(firstText(note))}</span>
          <div class="note-meta-row">
            <span class="note-time">${formatTime(note.updatedAt)}</span>
            ${tags.length ? `<span class="note-tags">${tags.map((t) => tagChipHtml(t)).join("")}</span>` : ""}
          </div>
          <button class="note-menu-trigger" data-note-menu="${note.id}" aria-label="Note actions"><i data-lucide="ellipsis"></i></button>
